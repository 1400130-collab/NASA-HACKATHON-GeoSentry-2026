<html lang="ko">
<head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
  .doc { width: 210mm; min-height: 297mm; margin: 18px auto 40px; background: #fff; padding: 11mm 12mm 12mm; box-shadow: 0 30px 80px rgba(0, 0, 0, .55); }
  .title { display: grid; grid-template-columns: 1fr auto; gap: 6mm; align-items: end; padding: 3mm 0 2.4mm; border-bottom: 2.4pt solid var(--line); }
  .title h1 { margin: .8mm 0 0; font-size: 25pt; font-weight: 900; letter-spacing: -.035em; line-height: 1.02; }
  .title h1 em { display: block; font-style: normal; font-weight: 700; font-size: 12pt; letter-spacing: -.01em; margin-top: 1.2mm; color: var(--mute); }
  .fno { border: 1pt solid var(--line); font-size: 7.4pt; }
  .fno div { display: grid; grid-template-columns: 19mm 31mm; }
  .fno div + div { border-top: .5pt solid var(--line); }
  .fno span { background: var(--fill); padding: .8mm 1.5mm; border-right: .5pt solid var(--line); }
  .fno b { padding: .8mm 1.5mm; font: 700 7.6pt/1.35 var(--mono); }
  .sum { display: grid; grid-template-columns: repeat(6, 1fr); border: .8pt solid var(--line); margin-top: 2.4mm; }
  .sum div { padding: 1.6mm 2mm 1.8mm; }
  .sum div + div { border-left: .5pt solid var(--line); }
  .sum b { display: block; font-size: 17pt; font-weight: 900; line-height: 1.05; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .sum b small { font-size: 8pt; font-weight: 700; letter-spacing: 0; }
  .sum span { font-size: 7pt; color: var(--mute); line-height: 1.25; display: block; margin-top: .4mm; }
  .sum .hot { background: var(--red); color: #fff; } .sum .hot span { color: #fde3dd; }
  .lbl { display: flex; align-items: baseline; gap: 2mm; margin: 3.2mm 0 1.2mm; }
  .lbl h2 { margin: 0; font-size: 10.5pt; font-weight: 900; letter-spacing: -.01em; }
  .lbl .kick { margin-left: auto; text-align: right; }
  .map { position: relative; width: 100%; height: 500px; overflow: hidden; border: .8pt solid var(--line); background: #eee; }
  .map canvas, .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map img { position: absolute; max-width: none; }
  .map .att { position: absolute; right: 0; bottom: 0; background: rgba(255,255,255,.85); padding: 0 1mm; font-size: 6pt; color: #333; }
  .key { display: flex; gap: 4.5mm; margin: 1.2mm 0 0; font-size: 7pt; color: var(--mute); flex-wrap: wrap; align-items: center; }
  .key i.d { display: inline-block; width: 2.4mm; height: 2.4mm; border-radius: 50%; margin-right: 1mm; vertical-align: -.3mm; }
  .key em { font-style: normal; margin-left: auto; }
  table { width: 100%; border-collapse: collapse; }
  table.f th, table.f td { border: .5pt solid var(--line); padding: 1.1mm 1.4mm; vertical-align: middle; text-align: left; }
  table.f th { background: var(--fill); font-weight: 600; font-size: 7pt; text-align: center; }
  table.f td.c { text-align: center; }
  table.list { font-size: 7.4pt; table-layout: fixed; }
  table.list thead th { font: 600 6.3pt/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; background: #0b0c0d; color: #f3f1ec; border-color: #0b0c0d; padding: 1.4mm 1.2mm; }
  table.list tr { break-inside: avoid; }
  table.list thead { display: table-header-group; }
  table.list td { padding: 1mm 1.4mm; }
  table.list td.th { padding: .8mm; width: 25mm; }
  .thumb { display: block; width: 23mm; height: 23mm; background: #eee; }
  .no { display: inline-grid; place-items: center; width: 5.6mm; height: 5.6mm; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 800; font-size: 7.6pt; text-decoration: none; }
  .fn { font: 700 7.8pt/1.3 var(--mono); }
  .ll { font: 400 6.8pt/1.35 var(--mono); color: var(--mute); }
  .geo { margin-top: .8mm; font-size: 7pt; }
  .dz { font-size: 16pt; font-weight: 900; letter-spacing: -.03em; line-height: 1; display: block; }
  .dzs { display: grid; gap: .6mm; margin-top: 1mm; }
  .dzs span { display: flex; align-items: center; gap: .8mm; font: 500 5.6pt/1 var(--mono); color: var(--mute); }
  .mo { font: 400 6.6pt/1.3 var(--mono); }
  .mo div { display: grid; grid-template-columns: 9mm 1fr; align-items: baseline; gap: 1mm; padding: .35mm 0; }
  .mo div + div { border-top: .4pt dotted #bbb; }
  .mo div i { font-style: normal; font-weight: 700; font-size: 5.6pt; letter-spacing: .06em; color: #fff; background: var(--red); padding: .3mm .6mm; text-align: center; }
  .mo div.ph i { background: var(--blue); } .mo div.na { color: #8b8983; } .mo div.na i { background: #a3a19b; }
  .mo div.bl i { background: var(--ink); }
  .mo b { font-weight: 700; color: var(--ink); }
  .mo .mv b { color: var(--red); }
  .why { font-size: 7pt; line-height: 1.35; }
  .why span { display: inline-block; border: .5pt solid #a9a7a0; padding: .1mm 1.1mm; margin: 0 .6mm .7mm 0; border-radius: 1mm; background: #faf9f6; }
  .why span.mv { background: var(--red); color: #fff; border-color: var(--red); font-weight: 700; }
  .why span.hit { border-color: var(--red); color: #8f2414; font-weight: 600; }
  .res { font-size: 6.4pt; color: var(--mute); }
  .res .ln { display: block; border-bottom: .5pt solid var(--ink); height: 4.4mm; margin-bottom: 1mm; }
  .res .boxes { display: flex; gap: 1mm; }
  .res .boxes b { width: 3.8mm; height: 3.8mm; border: .7pt solid var(--ink); display: grid; place-items: center; font: 700 6.2pt/1 var(--mono); color: var(--ink); }
  .ln2 { display: inline-block; border-bottom: .5pt solid var(--ink); height: 3.4mm; vertical-align: bottom; margin: 0 .6mm; }
  .end { break-inside: avoid; }
  .sig td { height: 11mm; }
  .foot { margin-top: 2.4mm; font-size: 6.9pt; color: var(--mute); line-height: 1.45; }
  .pb { break-before: page; }
  @media print { .doc { margin: 0; padding: 0 .4mm; width: auto; min-height: 0; box-shadow: none; } }
</style>
<style id="pg"></style>

<body>
<div class="bar"><a class="brand" href="index.html"><img class="geosentry-logo" src="img/geosentry-logo.svg?v=2" width="56" height="38" alt="">GeoSentry</a><select id="prov"></select><select id="county"></select><select id="count"></select><span class="st" id="status"></span><span class="sp"></span><a id="map"></a><a id="forms"></a><button id="lang"></button><button class="go" id="print" onclick="print()"></button></div>
<div class="doc" id="doc">Loading…</div>
<script type="module">
// The district priority sheet: one district's check-first slopes in inspection order, on paper.
//   sheet.html?county=214&n=25      &area=region for the 20 m North Gyeongsang map, &lang=en for English
// Page 1: the district in numbers, the models behind the list, a road map with every listed slope (and the simulated
// debris flows where they were run). Then the list: one row per slope with a small map of its own (js/paper.js: our
// vector map with its debris flow or its ML 3 reach), the danger index, what each model said, and a result box.
// Each row carries the form number of that slope's field form (form.html).
import { loadAll, BASE, AREA } from './js/data.js';
import { addScores, checkOrder } from './js/score.js';
import { reason, compass } from './js/i18n.js';
import { paperGeo, vectorMap, frameFor, osmMap, osmHillshade, flowsOnOSM, bar, RED, BLUE } from './js/paper.js';

const qs = new URLSearchParams(location.search);
let lang = qs.get('lang') || 'ko';
const L = (ko, en) => (lang === 'ko' ? ko : en);
const D = addScores(await loadAll(() => {}));
const C = D.col, M = D.meta, K = D.korea, REG = AREA === 'region' ? '&area=region' : '';
const order = checkOrder(D), byCounty = new Map();
order.forEach((u) => { const c = C.county[u]; if (!byCounty.has(c)) byCounty.set(c, []); byCounty.get(c).push(u); });
const counties = M.counties.filter((c) => byCounty.has(c.id));
if (K) counties.sort((a, b) => a.prov - b.prov || a.ko.localeCompare(b.ko, 'ko'));
const ranked = counties.slice().sort((a, b) => byCounty.get(b.id).length - byCounty.get(a.id).length);
const provs = M.provinces ? M.provinces.filter((p) => counties.some((c) => c.prov === p.id)) : null;
const provOf = (c) => (M.provinces ? M.provinces.find((p) => p.id === c.prov) : null);
const cname = (c) => { const p = provOf(c); return (p ? L(p.ko, p.en) + (lang === 'ko' ? ' ' : ' · ') : (K ? '' : L('경상북도 ', 'North Gyeongsang · '))) + L(c.ko, c.en); };
let county = +qs.get('county'); if (!byCounty.has(county)) county = ranked[0].id;
let count = [15, 25, 50, 100].includes(+qs.get('n')) ? +qs.get('n') : 25;
const normal = await new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = BASE + 'normal.jpg'; });
const G = await paperGeo(D, normal);

const $ = (s) => document.querySelector(s);
const sg = (v, d = 0) => { const a = Math.abs(v).toFixed(d); return (+a === 0 ? '' : v > 0 ? '+' : '−') + a; };
const r10 = (v) => (Math.round(v / 10) * 10).toLocaleString();
const fno = (u) => `SW-${K ? 'K' : 'R'}-${String(u).padStart(6, '0')}`;
const ln = (mm = 16) => `<span class="ln2" style="width:${mm}mm"></span>`;
const sim = (u) => !!(C.sim && C.sim[u] > 0);                       // regional: flagged slopes have their own GPU run
const hasV = (u) => !!C.vd && Number.isFinite(C.vd[u]) && C.vds[u] > 0;
const radar = (u) => !K || C.rcov[u] > 0;
const susc = M.suscept, ship = susc.shipped_uses_nisar ? susc.results.model_full : susc.results.model_without_nisar, AN = M.anomaly.results;
const xf = (v) => (Math.abs(v - Math.round(v)) < 0.15 ? Math.round(v) : v.toFixed(1));

// what each model said about one slope, as short mono lines
function models(u) {
  const out = [], top = Math.max(0.1, (1 - C.pct[u]) * 100);
  out.push(['', 'ML 1', `${L('위험 순위 상위', 'risk rank top')} <b>${top < 1 ? top.toFixed(1) : Math.round(top)}%</b>`]);
  if (!radar(u)) out.push(['na', 'ML 2', L('레이더 미처리 지역', 'no radar here')]);
  else if (hasV(u)) out.push([C.moving[u] ? 'mv ph' : 'ph', 'SOLVE', `<b>${sg(C.vd[u])} ± ${C.vds[u].toFixed(0)}</b> ${L('mm/월', 'mm/mo')}${C.moving[u] ? ' ▲' : ''}`]);
  else out.push(['na', 'ML 2', C.moving[u] ? `<b>${L('이동 감지', 'moving')}</b>` : L('측정값 없음', 'no rate')]);
  if (sim(u)) out.push(['ph', 'FLOW', `<b>${r10(C.rf_len[u])} m</b> · ${Math.round(C.rf_vmax[u])} m/s`]);
  else if (C.reach) out.push([C.reach_src[u] === 2 ? 'ph' : '', C.reach_src[u] === 2 ? 'FLOW' : 'ML 3', `${L('도달', 'reach')} <b>${r10(C.reach[u])} m</b>`]);
  const b = C.bld[u], rd = C.road[u] > 0, tb = sim(u) && Number.isFinite(C.rf_tbld[u]);
  out.push(['bl', '↓', b || rd ? `<b>${[b ? L(`건물 ${b}동`, `${b} bldg`) : '', rd ? L('도로', 'road') : ''].filter(Boolean).join(' · ')}</b>${tb ? ` · ${Math.round(C.rf_tbld[u])} s` : ''}` : L('표시 시설 없음', 'nothing mapped')]);
  return out.map(([c, k, v]) => `<div class="${c}"><i>${k}</i><span>${v}</span></div>`).join('');
}
function why(u) {
  const w = [];
  if (C.moving[u]) w.push(`<span class="mv">${L('레이더 이동 감지', 'radar: moving')}</span>`);
  [[C.r1[u], C.v1[u]], [C.r2[u], C.v2[u]], [C.r3[u], C.v3[u]]].forEach(([r, v]) => { if (r >= 0) w.push(`<span>${reason(M.features[r], v, lang)}</span>`); });
  if (C.label[u]) w.push(`<span>${L('2026.7 붕괴 후보지', 'Jul 2026 scar candidate')}</span>`);
  if (sim(u) && C.rf_bld[u] > 0) w.push(`<span class="hit">${L(`모의 토석류가 건물 ${C.rf_bld[u]}동에 도달`, `simulated debris reaches ${C.rf_bld[u]} bldg`)}</span>`);
  else if (C.reach && C.bld[u] > 0) w.push(`<span class="hit">${L(`도달 거리 안 건물 ${C.bld[u]}동`, `${C.bld[u]} bldg inside its reach`)}</span>`);
  return w.join('');
}

let ticket = 0;
async function render() {
  const my = ++ticket;
  const c = M.counties.find((x) => x.id === county), all = byCounty.get(county), top = all.slice(0, count), name = cname(c), built = M.generated.slice(0, 10);
  let nWatch = 0, nMove = 0, nBld = 0, nRoad = 0, nTop5 = 0, nSolved = 0, nCov = 0, nUnits = 0; const errs = [];
  for (let u = 0; u < D.n; u++) if (C.county[u] === county) { nUnits++; if (C.level[u] === 2) nWatch++; if (C.moving[u]) nMove++; if (C.pct[u] >= 0.95) nTop5++; if (hasV(u)) { nSolved++; errs.push(C.vds[u]); } if (radar(u)) nCov++; }
  const errMed = errs.length ? errs.sort((a, b) => a - b)[errs.length >> 1] : 0;
  all.forEach((u) => { if (C.bld[u] > 0) nBld++; if (C.road[u] > 0) nRoad++; });
  const place = ranked.findIndex((x) => x.id === county) + 1, title = L('사면 점검 우선순위표', 'Slope inspection priority sheet');

  // the flows to draw on the district map: this district's GPU runs (regional), or the regional runs inside it (nationwide)
  let flows = [];
  if (G && G.flowCells) {
    if (!K) { for (let i = 0; i < D.runout.nf; i++) if (C.county[D.runout.unit[i]] === county) flows.push(i); }
    else if (nCov) { let x0 = 1e12, x1 = -1e12, z0 = 1e12, z1 = -1e12; all.forEach((u) => { const [x, z] = G.unit(u); x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); });
      flows = G.flowsNear((x0 + x1) / 2, (z0 + z1) / 2, Math.hypot(x1 - x0, z1 - z0) / 2 + 3000); }
  }
  const flowBld = !K && C.sim ? all.filter((u) => sim(u) && C.rf_bld[u] > 0).length : 0;
  const reachMed = C.reach ? top.map((u) => C.reach[u]).sort((a, b) => a - b)[top.length >> 1] : 0;

  // toolbar
  document.documentElement.lang = lang; document.title = `GeoSentry · ${L(c.ko, c.en)} ${L('점검표', 'inspection sheet')}`;
  if (provs) $('#prov').innerHTML = provs.map((p) => `<option value="${p.id}" ${p.id === c.prov ? 'selected' : ''}>${L(p.ko, p.en)}</option>`).join(''); else $('#prov').hidden = true;
  $('#county').innerHTML = counties.filter((x) => !provs || x.prov === c.prov).map((x) => `<option value="${x.id}" ${x.id === county ? 'selected' : ''}>${L(x.ko, x.en)} (${byCounty.get(x.id).length})</option>`).join('');
  $('#count').innerHTML = [15, 25, 50, 100].map((n) => `<option value="${n}" ${n === count ? 'selected' : ''}>${L(`상위 ${n}곳`, `Top ${n}`)}</option>`).join('');
  $('#lang').textContent = lang === 'ko' ? 'English' : '한국어'; $('#print').textContent = L('인쇄 / PDF', 'Print / PDF');
  $('#map').textContent = L('지도', 'Map'); $('#map').href = `map.html?lang=${lang}${REG}`;
  $('#forms').textContent = L('사면별 현장 점검서 ▸', 'Field form per slope ▸'); $('#forms').href = `form.html?county=${county}&n=5&lang=${lang}${REG}`;
  $('#pg').textContent = `@page { size: A4; margin: 11mm 12mm 13mm; @bottom-left { content: "GeoSentry · ${name.replace(/"/g, '')} · ${title}"; font: 7pt system-ui, sans-serif; color: #5c5c5c; } @bottom-right { content: counter(page) " / " counter(pages); font: 7pt system-ui, sans-serif; color: #5c5c5c; } }`;
  $('#status').textContent = L('지도 그리는 중…', 'drawing maps…');

  // the models that made the list, with what each found in this district
  const det = AN.detector.well_oriented[3], mf = AN.matched.well_oriented[3];
  const tile = (cls, k, nm, v, p, g) => `<div class="${cls}"><i>${k}</i><span>${nm}</span><b>${v}</b>${g !== undefined ? `<span class="gauge"><u style="width:${Math.min(100, Math.max(2, g * 100)).toFixed(0)}%"></u></span>` : ''}<p>${p}</p></div>`;
  const stack = [
    tile('', 'ML 1', L('위험 순위 · LightGBM', 'Risk ranker · LightGBM'), `${nTop5.toLocaleString()}<small> ${L('곳', 'slopes')}</small>`, L(`전국 상위 5%에 드는 이 시·군 사면. 처음 보는 지역에서 무작위보다 ${xf(ship.capture_top5 / 0.05)}배 잘 찾음`, `here in the national top 5%. Finds failures ${xf(ship.capture_top5 / 0.05)}× better than guessing on ground it never saw`), nTop5 / Math.max(1, nUnits) * 10),
    nCov ? tile('', 'ML 2', L('이동 탐지 · GRU', 'Movement detector · GRU'), `${nMove}<small> ${L('곳 이동', 'moving')}</small>`, L(`레이더 시계열 신경망. 3 cm 이동을 고전 필터보다 ${xf(det / mf)}배 잘 잡음`, `neural net on the radar time series. Catches 3 cm ${xf(det / mf)}× better than the classical filter`), det)
      : tile('na', 'ML 2', L('이동 탐지 · GRU', 'Movement detector · GRU'), '—', L('이 시·군에는 NISAR 레이더를 아직 처리하지 않음 (경북 산불 지역만). 위험 순위로만 선정', 'NISAR radar not processed here yet (North Gyeongsang burn area only). Listed by the risk rank alone')),
    K && M.reach ? tile('', 'ML 3', L('토석류 도달 거리', 'Debris reach'), `${r10(reachMed)}<small> m</small>`, L(`이 표 사면의 중간값. GPU 모의 ${M.reach.simulated_slopes.toLocaleString()}건으로 학습, 처음 보는 시·군에서 R² ${M.reach.far.r2_heldout.toFixed(2)}`, `median for the slopes listed. Learned from ${M.reach.simulated_slopes.toLocaleString()} GPU runs; R² ${M.reach.far.r2_heldout.toFixed(2)} on counties it never saw`), reachMed / 450) : '',
    flows.length ? tile('ph', 'PHYSICS', L('토석류 모의 · GPU', 'Debris-flow simulation · GPU'), `${flows.length.toLocaleString()}<small> ${L('건', 'runs')}</small>`, !K ? L(`이 시·군 위험 사면마다 40 m 붕괴를 놓고 계산. ${flowBld}건이 건물에 닿음 → 목록에 올림`, `a 40 m slide let go on every flagged slope here. ${flowBld} reach a building and put the slope on the list`) : L('20 m 지역 모의(경북 산불 지역)의 흐름. 지도에 표시', 'runs from the 20 m regional model (burn area), drawn on the map'), flowBld / Math.max(1, flows.length) * 4)
      : '',
    nSolved ? tile('ph', 'SOLVER', L('레이더 속도 역산', 'Radar speed solver'), `${nSolved.toLocaleString()}<small> ${L('곳', 'slopes')}</small>`, L(`영상쌍 23개를 최소제곱으로 풀어 사면별 월 이동 속도와 오차를 구함. 이 시·군 중간 오차 ±${errMed.toFixed(0)} mm/월`, `23 image pairs solved by least squares for each slope's downslope speed and error bar. Median error here ±${errMed.toFixed(0)} mm a month`), nSolved / Math.max(1, nUnits)) : '',
  ].filter(Boolean).join('');

  // the district map: OpenStreetMap fitted to the listed slopes, our relief under it, every check-first and watch slope, the flows
  const MW = 702, MH = 500, m = osmMap({ W: MW, H: MH, fit: top.map((u) => [C.lat[u], C.lon[u]]) });
  const marks = top.map((u, i) => { const [x, y] = m.px(C.lat[u], C.lon[u]); return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="8" fill="#111" stroke="#fff" stroke-width="1.6"/><text y="3.2" text-anchor="middle" font-size="${i > 98 ? 7 : 9}" font-weight="700" fill="#fff" font-family="Roboto, sans-serif">${i + 1}</text></g>`; }).reverse().join('');
  let ckm = [0, 0]; top.forEach((u) => { ckm[0] += C.x[u] / top.length; ckm[1] += C.z[u] / top.length; });

  const H = [L('순위', 'No.'), L('현장', 'Site'), L('서식 번호 · 위치', 'Form no. · where'), L('위험', 'Danger'), L('모델 출력', 'What the models said'), L('선정 사유', 'Why it is listed'), L('점검일 · 판정', 'Date · result')];
  const Wd = [8, 25, 31, 16, 38, 0, 19];
  const rows = top.map((u, i) => `<tr><td class="c"><a class="no" href="form.html?u=${u}&lang=${lang}${REG}" title="${L('이 사면의 현장 점검서', 'Field form for this slope')}">${i + 1}</a></td>
      <td class="th"><canvas class="thumb" data-u="${u}" data-i="${i}" width="261" height="261"></canvas></td>
      <td><span class="fn">${fno(u)}</span><br><span class="ll">${C.lat[u].toFixed(5)}, ${C.lon[u].toFixed(5)}</span><div class="geo">${C.slope[u].toFixed(0)}° ${compass(C.aspect[u], lang)}${L('향', '')} · ${C.elev[u].toFixed(0)} m</div></td>
      <td class="c"><span class="dz">${Math.round(C.danger[u])}</span><span class="dzs"><span>${L('사면', 'SLP')} ${bar(C.hz[u] / 100, RED, 8)}</span><span>${L('아래', 'BLW')} ${bar(C.ex[u] / 100, '#111', 8)}</span></span></td>
      <td class="mo">${models(u)}</td><td class="why">${why(u)}</td>
      <td class="res"><span class="ln"></span><span class="boxes"><b>A</b><b>B</b><b>C</b><b>D</b></span></td></tr>`).join('');
  const DOWN = K ? 360 : 300;
  const flowKey = flows.length ? `<span><span class="ramp"><i></i></span> ${L('모의 토석류 · 도착 시각 (빠름 → 늦음)', 'simulated debris flow · arrival (early → late)')}</span>` : '';

  $('#doc').innerHTML = `
    <div class="band"><img src="img/geosentry-logo.svg?v=2" alt=""><span class="wm">GeoSentry</span><span class="kind">${L('사면 점검 우선순위표', 'Slope inspection priority sheet')}<br>${L('위성 레이더 · 학습 모델 · GPU 물리', 'Satellite radar · trained models · GPU physics')}</span><span class="id">SWL-${K ? 'K' : 'R'}-${String(county).padStart(3, '0')}</span></div>
    <div class="title"><div><div class="kick">${L('우선 점검', 'Check first')} · <b>${L(`상위 ${top.length}곳`, `top ${top.length}`)}</b> / ${all.length.toLocaleString()} · ${L('위험 지수 순 = 점검 순서', 'in danger-index order = inspection order')}</div>
        <h1>${name}<em>${title}</em></h1></div>
      <div class="fno"><div><span>${L('문서 번호', 'Sheet no.')}</span><b>SWL-${K ? 'K' : 'R'}-${String(county).padStart(3, '0')}</b></div><div><span>${L('자료 생성', 'Data built')}</span><b>${built}</b></div><div><span>${L('수록 사면', 'Slopes listed')}</span><b>${top.length} / ${all.length.toLocaleString()}</b></div><div><span>${L('지도', 'Map')}</span><b>${K ? L('전국 90 m', 'Korea 90 m') : L('경북 20 m', 'Region 20 m')}</b></div></div></div>
    <div class="note">${L('초안 — 해커톤 시제품이며 정부 공식 서식이 아닙니다. 경보가 아니고 붕괴 시점을 예측하지 않습니다. 현장 점검 순서를 정하는 참고 자료입니다.', 'Draft — a hackathon prototype, not an official government form. Not a warning and not a forecast of when a slope will fail. A guide to the order of field inspection.')}</div>
    <div class="sum">
      <div class="hot"><b>${all.length.toLocaleString()}</b><span>${L('우선 점검 사면', 'check-first slopes')}</span></div>
      <div><b>${nWatch.toLocaleString()}</b><span>${L('관찰 사면', 'watch slopes')}</span></div>
      <div><b>${nCov ? nMove : '—'}</b><span>${nCov ? L('레이더 이동 감지', 'with radar movement') : L('레이더 미처리', 'no radar processed here')}</span></div>
      <div><b>${nBld.toLocaleString()}</b><span>${L('아래에 건물이 있는 우선 점검 사면', 'check-first slopes above buildings')}</span></div>
      <div><b>${nRoad.toLocaleString()}</b><span>${L('아래에 주요 도로가 있는 우선 점검 사면', 'check-first slopes above a main road')}</span></div>
      <div><b>${place}<small> / ${ranked.length}</small></b><span>${L('시·군 중 우선 점검 수 순위', 'rank among districts by check-first count')}</span></div>
    </div>
    <div class="lbl"><h2>${L('이 목록을 만든 모델', 'The models behind this list')}</h2><span class="kick">${L('이 시·군에서 각 모델이 찾은 것', 'what each one found in this district')}</span></div>
    <div class="stack">${stack}</div>
    <div class="lbl"><h2>${L('점검 대상 위치', 'Where they are')}</h2><span class="kick">${L('번호 = 점검 순서', 'number = inspection order')}</span></div>
    <div class="map"><canvas id="hs" width="${MW}" height="${MH}"></canvas>${m.tiles}<canvas id="dots" width="${MW * 2}" height="${MH * 2}"></canvas><svg viewBox="0 0 ${MW} ${MH}">${marks}${m.deco}</svg><span class="att">© OpenStreetMap</span></div>
    <div class="key"><span><i class="d" style="background:#111"></i>${L('이 표의 순위 번호', 'number on this sheet')}</span><span><i class="d" style="background:var(--red)"></i>${L('우선 점검', 'check first')}</span><span><i class="d" style="background:var(--amber)"></i>${L('관찰', 'watch')}</span>${flowKey}</div>
    <div class="lbl pb"><h2>${L('점검 순서', 'Inspection order')}</h2><span class="kick">${L('번호를 누르면 사면별 현장 점검서 · 판정 칸 A–D 중 하나에 ○', 'tap a number for the slope\'s field form · circle one of A–D under Result')}</span></div>
    <table class="f list"><colgroup>${Wd.map((w) => `<col${w ? ` style="width:${w}mm"` : ''}>`).join('')}</colgroup><thead><tr>${H.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
    <div class="key" style="margin-top:1.4mm"><span><b>${L('현장 지도', 'Site maps')}</b>: ${L('점선 원 = 분석 격자', 'dashed circle = the cell analysed')}</span>${C.reach ? `<span><span class="sw" style="background:rgba(199,52,31,.3);border:1px dashed var(--red)"></span>${L('ML 3 토석류 도달 거리 (사면 방향, 실제 경로는 계곡을 따름)', 'ML 3 debris reach (toward the facing; real paths follow the valley)')}</span>` : ''}${G?.flowCells ? `<span><span class="ramp"><i style="width:10mm"></i></span> ${L('모의 토석류', 'simulated debris flow')}</span>` : ''}<span><span class="sw" style="background:var(--red);outline:.5pt solid #111"></span>${L('흐름 아래 건물', 'building under the flow')}</span><em>${L('건물·도로: Overture Maps · 토지피복: ESA WorldCover · 수관고: NASA GEDI', 'Buildings, roads: Overture Maps · land cover: ESA WorldCover · canopy: NASA GEDI')}</em></div>
    <div class="end">
      <div class="lbl"><h2>${L('점검 집계', 'Tally')}</h2><span class="kick">A ${L('이상 없음', 'no concern')} · B ${L('관찰', 'observe')} · C ${L('정밀 조사', 'detailed survey')} · D ${L('긴급 조치', 'urgent')}</span></div>
      <table class="f"><tr><th style="width:26mm">${L('점검 완료', 'Inspected')}</th><td>${ln(12)} / ${top.length}${L('곳', '')}</td><th style="width:10mm">A</th><td>${ln(10)}</td><th style="width:10mm">B</th><td>${ln(10)}</td><th style="width:10mm">C</th><td>${ln(10)}</td><th style="width:10mm">D</th><td>${ln(10)}</td></tr></table>
      <table class="f sig" style="margin-top:1.6mm"><thead><tr><th style="width:26mm"></th><th>${L('부서 · 직급', 'Office · post')}</th><th>${L('성명', 'Name')}</th><th>${L('서명', 'Signature')}</th><th style="width:30mm">${L('날짜', 'Date')}</th></tr></thead>
        <tr><th>${L('담당자', 'Officer')}</th><td></td><td></td><td></td><td></td></tr><tr><th>${L('확인자', 'Reviewed by')}</th><td></td><td></td><td></td><td></td></tr></table>
      <div class="foot"><b>${L('등급 규칙', 'Level rule')}</b> — ${L(`"우선 점검": 레이더가 이동을 감지했거나 AI 위험 순위가 상위 5%이고, ${C.sim ? '모의 토석류가 건물이나 주요 도로에 닿는 사면' : C.reach ? 'AI 3이 예측한 그 사면의 토석류 도달 거리 안에 건물이나 주요 도로가 있는 사면' : `아래쪽 약 ${DOWN} m 이내에 건물이나 주요 도로가 있는 사면`}. "관찰": 이동 감지 또는 상위 20%. 이동 속도는 사면 아래 방향 값이며 ± 뒤는 오차입니다${K ? ' (NISAR 레이더는 경북 산불 지역만 처리, 그 밖은 AI 순위만으로 선정)' : ''}. 목록의 건물 수는 OpenStreetMap 기준이며 농촌 주택이 빠져 있을 수 있습니다. 현장 지도의 건물은 더 많은 건물을 담은 Overture Maps입니다. AI 모델은 2026년 7월 폭우 때의 붕괴지(자동 탐지 ${M.suscept.n_failed}곳, 사람이 아직 확인하지 않음)로 학습했습니다. 이동이 없는 사면이 안전하다는 뜻은 아닙니다.`,
        `"Check first": the radar detected movement or the AI risk rank puts the slope in the top 5%, and ${C.sim ? 'a simulated debris flow from the slope reaches a building or main road' : C.reach ? 'a building or main road lies inside the debris reach that AI model 3 predicts for the slope' : `a building or main road lies within about ${DOWN} m downslope`}. "Watch": movement detected, or top 20%. Speeds are down the slope; the figure after ± is the error bar${K ? ' (NISAR radar was processed for the North Gyeongsang burn area only; elsewhere the AI rank alone decides)' : ''}. Building counts in the list come from OpenStreetMap and may miss rural houses; the site maps draw Overture Maps footprints, which hold more. The AI model learned from slopes that failed in the July 2026 storm (${M.suscept.n_failed} found automatically, not yet checked by a person). No movement does not mean a slope is safe.`)}
        ${L('지형: Copernicus DEM · 광학: Sentinel-2 · 강우: ERA5 · 레이더: NASA-ISRO NISAR · 수관고: NASA GEDI.', 'Terrain: Copernicus DEM · Optical: Sentinel-2 · Rain: ERA5 · Radar: NASA-ISRO NISAR · Canopy: NASA GEDI.')}</div>
    </div>`;
  history.replaceState(null, '', `?county=${county}&n=${count}&lang=${lang}${REG}`);

  // paint: relief and dots under the district map, flows over it, then one small map per row
  if (G) osmHillshade(G, $('#hs'), ckm, m.mpp);
  const dg = $('#dots').getContext('2d');
  dg.save(); dg.scale(2, 2);
  for (const [lv, col, r] of [[2, K ? 'rgba(217,154,28,.8)' : 'rgba(217,154,28,.45)', K ? 1.7 : 1.1], [3, 'rgba(199,52,31,.95)', K ? 2.8 : 2.2]]) {
    dg.fillStyle = col;
    for (let u = 0; u < D.n; u++) if (C.level[u] === lv && C.county[u] === county) { const [x, y] = m.px(C.lat[u], C.lon[u]); if (x > -5 && y > -5 && x < MW + 5 && y < MH + 5) { dg.beginPath(); dg.arc(x, y, r, 0, 6.3); dg.fill(); } }
  }
  dg.restore();
  if (G && flows.length) { let cx = 0, cz = 0; top.forEach((u) => { const p = G.unit(u); cx += p[0] / top.length; cz += p[1] / top.length; }); flowsOnOSM(G, $('#dots'), m, flows, G.fitLL(cx, cz, 30000)); }
  if (!G) { $('#status').textContent = ''; return; }
  const cvs = [...document.querySelectorAll('canvas.thumb')];
  let done = 0;
  await Promise.all(cvs.map(async (cv) => {
    const u = +cv.dataset.u, fl = G.flowsOf(u), reach = !sim(u) && !fl.length && C.reach ? C.reach[u] : 0;
    const f = frameFor(G, u, { flows: fl, reach: reach + G.cellR * 0.4, aspect: C.aspect[u], min: K ? 900 : 420, pad: 1.12 });
    if (my !== ticket) return;
    await vectorMap(G, cv, { cx: f.cx, cz: f.cz, hx: f.hx, hz: f.hz, mpp: f.w / 87, dpr: 3, hexR: G.cellR, flows: fl, ghost: K ? [] : G.flowsNear(f.hx, f.hz, f.w).filter((i) => !fl.includes(i)),
      fan: reach ? { r: reach + G.cellR * 0.4, az: C.aspect[u] } : null, north: false, scale: true, roadScale: 0.5, contours: false });
    if (my === ticket) $('#status').textContent = `${++done} / ${cvs.length}`;
  }));
  if (my === ticket) $('#status').textContent = '';
}
$('#prov').onchange = (e) => { county = ranked.find((x) => x.prov === +e.target.value).id; render(); };
$('#county').onchange = (e) => { county = +e.target.value; render(); };
$('#count').onchange = (e) => { count = +e.target.value; render(); };
$('#lang').onclick = () => { lang = lang === 'ko' ? 'en' : 'ko'; render(); };
render();
</script>
<script src="js/nav.js?v=7" defer></script>
</body>
</html>
