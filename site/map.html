<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoSentry · map</title>
<meta name="description" content="Slope inspection priorities for all of South Korea, with NISAR radar in the North Gyeongsang burn area. Hackathon draft.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="theme-color" content="#0b0c0d">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&family=Roboto+Mono:wght@100..700&display=swap">
<link rel="stylesheet" href="css/app.css?v=17">
<link rel="stylesheet" href="css/inversion.css?v=2">
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
<link rel="icon" type="image/svg+xml" href="img/geosentry-logo.svg?v=2">
<link rel="stylesheet" href="css/brand.css?v=3">
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>

<div id="intro">
  <div class="intro-inner">
    <div class="mark"><img class="geosentry-logo" src="img/geosentry-logo.svg?v=2" width="46" height="32" alt=""></div>
    <h1>GeoSentry</h1>
    <p data-i18n="tagline">Which slopes to check before the next rainy season</p>
    <div class="bar"><i id="introBar"></i></div>
    <small id="introMsg">Loading terrain…</small>
  </div>
</div>

<header id="top">
  <a class="brand" href="index.html" title="GeoSentry home"><img class="geosentry-logo" src="img/geosentry-logo.svg?v=2" width="46" height="32" alt="">GeoSentry</a>
  <span class="sub" data-i18n="sub"></span>
  <nav>
    <a id="btnHome" href="index.html" data-i18n="home">About the project</a>
    <button id="btnBoard" data-i18n="lb">Leaderboard</button>
    <a id="btnSheet" href="sheet.html" target="_blank" data-i18n="sheet">Inspection sheet</a>
    <button id="btnStory"><svg viewBox="0 0 16 16" width="9" height="9" aria-hidden="true"><path d="M3 2l11 6-11 6z" fill="currentColor"/></svg><span data-i18n="story">Storm replay</span></button>
    <button id="btnAI" class="primary" data-i18n="ai">How the AI works</button>
    <button id="btnLang" title="Language">KO</button>
  </nav>
</header>

<aside id="left">
  <div id="areaSel"></div>
  <h3 data-i18n="layers">What to show</h3>
  <div id="modes" role="radiogroup"></div>
  <div id="imgSel" hidden>
    <h4 data-i18n="imgdate">Photo date</h4>
    <div class="seg wrap" id="imgs"></div>
  </div>
  <div id="legend"></div>
  <label class="switch" id="bldSwitch" data-tip="bld_tip"><span><i class="bdot"></i><span data-i18n="t_bld"></span></span><input type="checkbox" data-k="buildings" checked><b></b></label>
  <label class="switch" id="debrisSwitch" hidden><span><i class="bdot" style="background:#ff8a2a;box-shadow:0 0 8px #ff8a2a"></i><span data-i18n="t_debris"></span></span><input type="checkbox" data-k="debris"><b></b></label>
  <details id="adv">
    <summary data-i18n="more">More layers &amp; options</summary>
    <div id="modesAdv" role="radiogroup"></div>
    <div id="trackSel" hidden>
      <h4 data-i18n="track">Radar track</h4>
      <div class="seg" id="tracks"></div>
    </div>
    <h4 data-i18n="show">Map details</h4>
    <div id="toggles"></div>
    <label class="slider"><span data-i18n="relief">Mountain height</span><input id="exag" type="range" min="1" max="5" step="0.1" value="2.6"><output id="exagOut">×2.6</output></label>
    <label class="slider"><span data-i18n="opacity">Colour strength</span><input id="opac" type="range" min="0" max="1" step="0.02" value="0.92"><output id="opacOut">92%</output></label>
    <p class="src" data-i18n="world_src"></p>
  </details>
</aside>

<aside id="right">
  <div id="tabs">
    <button data-tab="list" class="on" data-i18n="tabList">Check first</button>
    <button data-tab="detail" data-i18n="tabDetail">Selected slope</button>
    <button data-tab="numbers" data-i18n="tabNumbers">Numbers</button>
  </div>
  <section id="tab-list"></section>
  <section id="tab-detail" hidden></section>
  <section id="tab-numbers" hidden></section>
</aside>

<footer id="time">
  <div class="tctl">
    <button id="play" title="Play / pause"><svg viewBox="0 0 16 16" width="14" height="14"><path id="playIcon" d="M3 2l11 6-11 6z" fill="currentColor"/></svg></button>
    <div class="date"><b id="tDate">1 Jun 2026</b><span id="tNote"></span></div>
  </div>
  <div id="tl"></div>
</footer>

<div id="caption" hidden><div class="cap-step"></div><div class="cap-text"></div><div class="cap-src"></div><button id="capSkip">Skip</button></div>
<div id="hover" hidden></div>
<div id="tip" hidden></div>
<p id="hint" data-i18n="hint"></p>

<div id="modal" hidden>
  <div class="sheet">
    <button class="close" aria-label="Close">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module" src="js/main.js?v=37"></script>
<script src="js/nav.js?v=6" defer></script>
</body>
</html>
