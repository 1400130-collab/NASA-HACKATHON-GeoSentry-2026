<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoSentry 사면 현장 점검서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&family=Roboto+Mono:wght@100..700&display=swap">
<style>
  :root { --ink: #111; --mute: #5c5c5c; --line: #111; --soft: #b9b9b4; --fill: #ecece8; --red: #c7341f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0c0d; color: var(--ink); font: 8.6pt/1.4 "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  /* top bar: the site header's type, wordmark and buttons */
  .bar { position: sticky; top: 0; z-index: 5; background: #0b0c0d; color: #f3f1ec; min-height: 68px; padding: 12px clamp(16px, 4vw, 48px); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font: 500 14px/1 "Roboto", "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", system-ui, sans-serif; }
  .bar .brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; margin-right: 14px; color: #f3f1ec; text-decoration: none; border: 0; background: none; padding: 0; box-shadow: none; max-width: none; }
  .bar .brand svg { color: #ff4d2e; }
  .bar select, .bar button:not(.snav-btn), .bar a:not(.brand) { font: inherit; padding: 10px 13px; border-radius: 6px; border: 0; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); background: none; color: #f3f1ec; cursor: pointer; text-decoration: none; max-width: 230px; transition: box-shadow .15s, background .15s, color .15s; }
  .bar select { background: #121416; color-scheme: dark; }
  .bar select:hover, .bar button:not(.snav-btn):hover, .bar a:not(.brand):hover { box-shadow: inset 0 0 0 1px #b4b1a9; }
  .bar .go:not(.snav-btn), .bar .go:not(.snav-btn):hover { background: #f3f1ec; color: #0b0c0d; box-shadow: none; font-weight: 600; }
  .bar .go:not(.snav-btn):hover { background: #ff4d2e; }
  .bar .sp { flex: 1; }
  .page { position: relative; width: 210mm; height: 297mm; margin: 14px auto; background: #fff; padding: 11mm 13mm 15mm; overflow: hidden; }
  .pf { position: absolute; left: 13mm; right: 13mm; bottom: 7mm; display: flex; justify-content: space-between; border-top: .5pt solid var(--line); padding-top: 1.2mm; font-size: 7pt; color: var(--mute); }
  .rh { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.6pt solid var(--line); padding-bottom: 1.2mm; margin-bottom: 3mm; font-size: 8pt; }
  .rh b { font-size: 10pt; }
  header.h1 { display: grid; grid-template-columns: 1fr auto; gap: 6mm; align-items: end; border-bottom: 2.2pt solid var(--line); padding-bottom: 2mm; }
  header.h1 h1 { margin: 0; font-size: 21pt; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  header.h1 small { display: block; font-size: 7.5pt; letter-spacing: .14em; color: var(--mute); font-weight: 600; margin-bottom: 1mm; }
  .fno { border: 1pt solid var(--line); font-size: 7.5pt; }
  .fno div { display: grid; grid-template-columns: 19mm 33mm; }
  .fno div + div { border-top: .5pt solid var(--line); }
  .fno span { background: var(--fill); padding: .8mm 1.5mm; border-right: .5pt solid var(--line); }
  .fno b { padding: .8mm 1.5mm; font-variant-numeric: tabular-nums; }
  .note { margin: 2.2mm 0; padding: 1.4mm 2mm; border: .8pt solid var(--red); color: var(--red); font-size: 7.8pt; }
  h2 { margin: 3.2mm 0 1.2mm; font-size: 10pt; font-weight: 800; display: flex; align-items: baseline; gap: 2mm; }
  h2 i { font-style: normal; background: var(--ink); color: #fff; padding: .2mm 1.6mm; font-size: 8.5pt; }
  h2 em { font-style: normal; font-weight: 500; font-size: 7.5pt; color: var(--mute); margin-left: auto; }
  .part { margin: 0 0 1mm; padding: 1.2mm 2mm; background: var(--ink); color: #fff; font-weight: 800; font-size: 10pt; display: flex; justify-content: space-between; }
  .part span { font-weight: 500; font-size: 7.8pt; opacity: .85; }
  table { width: 100%; border-collapse: collapse; }
  table.f th, table.f td { border: .5pt solid var(--line); padding: 1.15mm 1.6mm; vertical-align: middle; text-align: left; }
  table.f th { background: var(--fill); font-weight: 600; white-space: nowrap; }
  table.f thead th { text-align: center; font-size: 7.6pt; }
  table.f td.c { text-align: center; }
  table.f td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.f td small, .hint { color: var(--mute); font-size: 7.2pt; }
  table.f td.w { height: 7.4mm; }
  table.f tr.tall td { height: 9.2mm; }
  table.kv th { width: 27mm; }
  .big { font-size: 13pt; font-weight: 800; }
  .lv { display: inline-block; border: 1.2pt solid var(--ink); padding: 0 1.6mm; font-weight: 800; }
  .lv.l3 { background: var(--ink); color: #fff; }
  .cb { display: inline-flex; align-items: center; gap: 1mm; margin-right: 3mm; white-space: nowrap; }
  .cb i { width: 3mm; height: 3mm; border: .8pt solid var(--ink); display: inline-block; flex: none; }
  td.c .cb { margin: 0; }
  .ln { display: inline-block; border-bottom: .5pt solid var(--ink); height: 3.4mm; vertical-align: bottom; margin: 0 .6mm; }
  .maps { display: grid; grid-template-columns: 340px 340px; justify-content: space-between; margin-top: 1mm; }
  .map { position: relative; width: 340px; height: 262px; overflow: hidden; border: .5pt solid var(--line); background: #eee; }
  .map canvas, .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map img { position: absolute; max-width: none; }
  .map .tag { position: absolute; left: 0; top: 0; background: #fff; border-right: .5pt solid var(--line); border-bottom: .5pt solid var(--line); padding: .4mm 1.6mm; font-weight: 700; font-size: 7.5pt; }
  .map .att { position: absolute; right: 0; bottom: 0; background: rgba(255,255,255,.85); padding: 0 1mm; font-size: 6pt; color: #333; }
  .find { display: grid; grid-template-columns: 1fr 24mm; gap: 4mm; align-items: center; margin-top: 1.6mm; border: .5pt solid var(--line); padding: 1.6mm 2mm; }
  .find .qr svg { width: 24mm; height: 24mm; display: block; }
  .find .url { font-family: ui-monospace, Menlo, monospace; font-size: 7.4pt; word-break: break-all; }
  ul.why { margin: 0; padding: 0; list-style: none; border: .5pt solid var(--line); }
  ul.why li { padding: 1.1mm 2mm 1.1mm 7mm; position: relative; }
  ul.why li + li { border-top: .5pt solid var(--soft); }
  ul.why li::before { content: attr(data-n); position: absolute; left: 2mm; font-weight: 800; }
  .chart { border: .5pt solid var(--line); padding: 1mm 1.5mm 0; }
  .chart svg { width: 100%; height: auto; display: block; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
  .safe { margin-top: 3mm; border: 1.6pt solid var(--ink); padding: 1.8mm 2.4mm; }
  .safe b { font-size: 9.5pt; }
  .verdict { display: grid; grid-template-columns: repeat(4, 1fr); border: .8pt solid var(--line); }
  .verdict div { padding: 1.6mm 2mm 2mm; min-height: 17mm; }
  .verdict div + div { border-left: .5pt solid var(--line); }
  .verdict b { display: flex; align-items: center; gap: 1.6mm; font-size: 10pt; }
  .verdict b i { width: 4.2mm; height: 4.2mm; border: 1pt solid var(--ink); flex: none; }
  .lines div { border-bottom: .5pt solid var(--soft); height: 7.2mm; }
  .grid { position: relative; height: 96mm; border: .8pt solid var(--line); }
  .grid > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .grid .north { position: absolute; right: 3mm; top: 2mm; font-weight: 800; text-align: center; line-height: 1; font-size: 9pt; }
  .grid .lg { position: absolute; left: 2mm; bottom: 1.5mm; right: 2mm; font-size: 7.2pt; color: var(--mute); background: #fff; padding: .6mm 1.2mm; border: .4pt solid var(--soft); }
  .foot { margin-top: 2.4mm; font-size: 7.2pt; color: var(--mute); line-height: 1.45; }
  .sig td { height: 12mm; }
  @media print {
    body { background: #fff; } .bar { display: none; }
    .page { margin: 0; break-after: page; }
    @page { size: A4; margin: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
<link rel="icon" type="image/svg+xml" href="img/geosentry-logo.svg?v=2">
<link rel="stylesheet" href="css/brand.css?v=3">
</head>
<body>
<div class="bar"><a class="brand" href="index.html"><img class="geosentry-logo" src="img/geosentry-logo.svg?v=2" width="46" height="32" alt="">GeoSentry</a><select id="county"></select><select id="slope"></select><select id="count"></select><span class="sp"></span><a id="back" href="sheet.html"></a><button id="lang"></button><button class="go" onclick="print()" id="print"></button></div>
<div id="out"><div class="page">Loading…</div></div>
<script type="module">
// One printable field inspection form per slope: six A4 pages.
//   Part A (pages 1-2) is filled in from the data; Part B (pages 3-6) is filled in by hand on the slope.
//   form.html?u=123            one slope            form.html?county=214&n=5   the county's top five
//   &area=region for the 20 m North Gyeongsang map, &lang=en for English
import { loadAll, BASE, AREA } from './js/data.js';
import { addScores, checkOrder } from './js/score.js';
import { reason, compass } from './js/i18n.js';

const qs = new URLSearchParams(location.search);
let lang = qs.get('lang') || 'ko';
const L = (ko, en) => (lang === 'ko' ? ko : en);
const D = addScores(await loadAll(() => {}));
const C = D.col, M = D.meta, K = D.korea;
const CELL = K ? { km2: 0.74, r: 480, z: 15 } : { km2: 0.105, r: 185, z: 16 };      // H3 res 8 / res 9 hexagon
const order = checkOrder(D), rankAll = new Map(order.map((u, i) => [u, i + 1]));
const byCounty = new Map();
order.forEach((u) => { const c = C.county[u]; if (!byCounty.has(c)) byCounty.set(c, []); byCounty.get(c).push(u); });
const counties = M.counties.filter((c) => byCounty.has(c.id));
if (K) counties.sort((a, b) => a.prov - b.prov || a.ko.localeCompare(b.ko, 'ko'));
const provOf = (c) => (M.provinces ? M.provinces.find((p) => p.id === c.prov) : null);
const cname = (id) => { const c = M.counties.find((x) => x.id === id); if (!c) return '—'; const p = provOf(c); return (p ? L(p.ko, p.en) + (lang === 'ko' ? ' ' : ' · ') : (K ? '' : L('경상북도 ', 'North Gyeongsang · '))) + L(c.ko, c.en); };

let sel = qs.has('u') ? Math.min(D.n - 1, Math.max(0, +qs.get('u') | 0)) : -1;
let county = sel >= 0 ? C.county[sel] : (+qs.get('county') || counties.slice().sort((a, b) => byCounty.get(b.id).length - byCounty.get(a.id).length)[0].id);
if (!byCounty.has(county) && sel < 0) county = counties[0].id;
if (sel < 0) sel = byCounty.get(county)[0];
let count = Math.min(10, Math.max(1, +qs.get('n') || 1));

const normal = await new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = BASE + 'normal.jpg'; });
await new Promise((res) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js'; s.onload = s.onerror = res; document.head.append(s); });

// ---- small pieces ---------------------------------------------------------------
const cb = (...o) => o.map((s) => `<span class="cb"><i></i>${s}</span>`).join('');
const ln = (mm = 16, unit = '') => `<span class="ln" style="width:${mm}mm"></span>${unit}`;
const sg = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const dms = (v, pos, neg) => { const a = Math.abs(v), d = Math.floor(a), m = Math.floor((a - d) * 60), s = ((a - d) * 60 - m) * 60; return `${d}°${String(m).padStart(2, '0')}′${s.toFixed(1).padStart(4, '0')}″${v >= 0 ? pos : neg}`; };
const fno = (u) => `SW-${K ? 'K' : 'R'}-${String(u).padStart(6, '0')}`;
const LV = () => [L('측정 불가', 'Not measurable'), L('신호 없음', 'No signal'), L('관찰', 'Watch'), L('우선 점검', 'Check first')];
const kv = (rows) => `<table class="f kv">${rows.map((r) => `<tr>${r.map(([k, v, span]) => `<th>${k}</th><td${span ? ` colspan="${span}"` : ''}>${v}</td>`).join('')}</tr>`).join('')}</table>`;
const day = (s) => `${+s.slice(4, 6)}.${+s.slice(6, 8)}`;
const best = (u) => { let b = null; D.tracks.forEach((tr) => { const v = C['cum_' + tr.id][u], s = C['sig_' + tr.id][u]; if (C['meas_' + tr.id][u] && Number.isFinite(v) && s > 0 && (!b || Math.abs(v / s) > Math.abs(b.v / b.s))) b = { v, s, id: tr.id }; }); return b; };
const slide = (u) => (C.vd && Number.isFinite(C.vd[u]) && C.vds[u] > 0 ? { v: C.vd[u], s: C.vds[u], ub: Math.ceil(Math.abs(C.vd[u]) + 2 * C.vds[u]) } : null);   // merged downslope rate, mm a month
const hasRadar = (u) => !K || C.rcov[u] > 0;

// ---- maps: OpenStreetMap tiles over a hillshade made from our own terrain (the hillshade shows if tiles can't load) ----
function map(u, z, half, label, scaleM) {
  const W = 340, H = 262, lat = C.lat[u], lon = C.lon[u], s = half ? 128 : 256, zz = half ? z + 1 : z, n = 2 ** zz;
  const fx = (lon + 180) / 360 * n, fy = (1 - Math.asinh(Math.tan(lat * Math.PI / 180)) / Math.PI) / 2 * n, x0 = fx - W / 2 / s, y0 = fy - H / 2 / s;
  const mpp = 156543.03392 * Math.cos(lat * Math.PI / 180) / 2 ** z;
  let t = '';
  for (let ty = Math.floor(y0); ty < y0 + H / s; ty++) for (let tx = Math.floor(x0); tx < x0 + W / s; tx++)
    t += `<img alt="" src="https://tile.openstreetmap.org/${zz}/${tx}/${ty}.png" style="left:${((tx - x0) * s).toFixed(1)}px;top:${((ty - y0) * s).toFixed(1)}px;width:${s}px;height:${s}px" onerror="this.remove()">`;
  const r = CELL.r / mpp, bar = scaleM / mpp, cx = W / 2, cy = H / 2;
  const mark = r > 12
    ? `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="rgba(199,52,31,.08)" stroke="#c7341f" stroke-width="2.2" stroke-dasharray="7 4"/><path d="M${cx - 7} ${cy}h14M${cx} ${cy - 7}v14" stroke="#c7341f" stroke-width="2.2"/>`
    : `<circle cx="${cx}" cy="${cy}" r="11" fill="none" stroke="#c7341f" stroke-width="2.6"/><circle cx="${cx}" cy="${cy}" r="3" fill="#c7341f"/>`;
  return `<div class="map"><canvas class="hs" width="${W}" height="${H}" data-u="${u}" data-mpp="${mpp}"></canvas>${t}
    <svg viewBox="0 0 ${W} ${H}">${mark}
      <g transform="translate(${W - 20} 22)"><path d="M0 -14L6 6L0 2L-6 6Z" fill="#111" stroke="#fff" stroke-width="1"/><text y="19" text-anchor="middle" font-size="10" font-weight="800" stroke="#fff" stroke-width="2.5" paint-order="stroke">N</text></g>
      <g transform="translate(10 ${H - 12})"><rect x="-4" y="-15" width="${(bar + 8).toFixed(1)}" height="22" fill="rgba(255,255,255,.85)"/><path d="M0 0h${bar.toFixed(1)}M0 -4v8M${bar.toFixed(1)} -4v8" stroke="#111" stroke-width="1.6" fill="none"/><text x="2" y="-5" font-size="9.5" font-weight="700">${scaleM >= 1000 ? scaleM / 1000 + ' km' : scaleM + ' m'}</text></g>
    </svg><span class="tag">${label}</span><span class="att">© OpenStreetMap</span></div>`;
}
function hillshades() {
  if (!normal) return;
  document.querySelectorAll('canvas.hs').forEach((cv) => {
    const u = +cv.dataset.u, km = +cv.dataset.mpp / 1000, w = cv.width * km, h = cv.height * km, g = cv.getContext('2d', { willReadFrequently: true });
    const sx = normal.width / D.Wkm, sy = normal.height / D.Hkm;
    g.fillStyle = '#eee'; g.fillRect(0, 0, cv.width, cv.height);
    g.imageSmoothingQuality = 'high'; g.drawImage(normal, (C.x[u] - w / 2) * sx, (C.z[u] - h / 2) * sy, w * sx, h * sy, 0, 0, cv.width, cv.height);
    const im = g.getImageData(0, 0, cv.width, cv.height), d = im.data;
    for (let i = 0; i < d.length; i += 4) {
      const nx = (d[i] / 255 - 0.5) * 2.4, ny = (d[i + 1] / 255 - 0.5) * 2.4, l = 1 / Math.hypot(nx * 2, ny * 2, 1);
      d[i] = d[i + 1] = d[i + 2] = 150 + 105 * Math.min(1, Math.max(0, (-0.55 * nx * 2 + 0.55 * ny * 2 + 0.63) * l) * 1.15);
    }
    g.putImageData(im, 0, 0);
  });
}

// ---- radar history, drawn for paper: black lines told apart by dash pattern ----
const DASH = ['', '5 3', '1.5 3'];
function chart(u) {
  const W = 660, H = 150, l = 34, r = 8, t = 8, b = 20, X0 = 15, X1 = 147;
  const S = D.tracks.map((tr, i) => ({ i, tr, pts: C['meas_' + tr.id][u] ? tr.days.map((d, k) => [d, D.cum(u, i, k)]).filter((p) => Number.isFinite(p[1])) : [] })).filter((s) => s.pts.length > 1);
  if (!S.length) return '';
  let ym = 2; S.forEach((s) => s.pts.forEach((p) => { ym = Math.max(ym, Math.abs(p[1]) * 1.2); })); ym = Math.ceil(ym);
  const x = (d) => l + (d - X0) / (X1 - X0) * (W - l - r), y = (v) => t + (ym - v) / (2 * ym) * (H - t - b);
  const np = D.tracks[0].noise_pair, s0 = np.reduce((a, c) => a + c, 0) / np.length, band = Array.from({ length: 12 }, (_, k) => [21 + k * 11, 2 * s0 * Math.sqrt(k)]);
  const step = ym <= 3 ? 1 : ym <= 8 ? 2 : 5, yt = []; for (let v = -Math.floor(ym / step) * step; v <= ym; v += step) yt.push(v);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" font-size="9.5">
    <rect x="${x(47)}" y="${t}" width="${x(49) - x(47)}" height="${H - t - b}" fill="#bbb"/>
    <path d="M${band.map(([d, v]) => `${x(d).toFixed(1)} ${y(Math.min(v, ym)).toFixed(1)}`).join('L')}L${band.slice().reverse().map(([d, v]) => `${x(d).toFixed(1)} ${y(-Math.min(v, ym)).toFixed(1)}`).join('L')}Z" fill="#e6e6e2"/>
    ${yt.map((v) => `<path d="M${l} ${y(v).toFixed(1)}H${W - r}" stroke="${v ? '#ccc' : '#111'}" stroke-width="${v ? .5 : 1}"/><text x="${l - 5}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${sg(v, 0)}</text>`).join('')}
    ${[[30, L('7월', 'Jul')], [61, L('8월', 'Aug')], [92, L('9월', 'Sep')], [122, L('10월', 'Oct')]].map(([d, s]) => `<path d="M${x(d)} ${H - b}v4" stroke="#111"/><text x="${x(d) + 3}" y="${H - 6}">${s}</text>`).join('')}
    <text x="${x(48)}" y="${t + 9}" text-anchor="middle" font-weight="700">${L('폭우', 'storm')}</text>
    ${S.map((s) => `<path d="M${s.pts.map((p) => `${x(p[0]).toFixed(1)} ${y(Math.max(-ym, Math.min(ym, p[1]))).toFixed(1)}`).join('L')}" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="${DASH[s.i]}"/>${s.pts.map((p) => `<circle cx="${x(p[0]).toFixed(1)}" cy="${y(Math.max(-ym, Math.min(ym, p[1]))).toFixed(1)}" r="2.2" fill="#fff" stroke="#111" stroke-width="1.2"/>`).join('')}`).join('')}
    <rect x="${l}" y="${t}" width="${W - l - r}" height="${H - t - b}" fill="none" stroke="#111" stroke-width=".8"/>
  </svg></div>
  <div class="hint" style="margin-top:.8mm">${S.map((s) => `<svg width="26" height="6" style="vertical-align:middle"><path d="M0 3H26" stroke="#111" stroke-width="1.5" stroke-dasharray="${DASH[s.i]}"/></svg> ${L('궤도', 'track')} ${s.tr.id} ${s.tr.dir === 'ascending' ? '↑' : '↓'}`).join(' &nbsp; ')} &nbsp; ${L('옅은 띠 = 잡음 범위(±2σ) · 짙은 띠 = 2026.7.18–19 폭우 · 세로축 = 레이더 시선 방향 누적 이동(cm)', 'pale band = noise range (±2σ) · dark band = storm of 18–19 Jul 2026 · vertical axis = cumulative movement along the radar line of sight (cm)')}</div>`;
}

// ---- what the data says about one slope ----------------------------------------
function facts(u) {
  const lv = C.level[u], b = best(u), sl = slide(u), pct = C.pct[u], radar = hasRadar(u);
  const rs = [[C.r1[u], C.v1[u]], [C.r2[u], C.v2[u]], [C.r3[u], C.v3[u]]].filter((r) => r[0] >= 0).map((r) => ({ f: M.features[r[0]], v: r[1], s: reason(M.features[r[0]], r[1], lang) }));
  const mv = !radar ? L('NISAR 레이더 미처리 지역 (경북 산불 지역만 처리). 안정하다는 뜻이 아님.', 'No NISAR radar here yet (processed for the North Gyeongsang burn area only). Not the same as stable.')
    : !b ? L('어느 궤도에서도 레이더로 측정할 수 없음. 안정하다는 뜻이 아님.', 'Radar cannot measure this slope on any track. Not the same as stable.')
      : C.vd && !sl ? L('레이더가 이 사면을 한쪽에서만 보아 미끄러짐을 다른 신호와 구분할 수 없음. 안정하다는 뜻이 아님.', 'Radar sees this slope from one side only, so sliding cannot be told apart from other signals. Not the same as stable.')
      : sl && C.moving[u] ? L(`폭우 이후 사면 방향 이동: 월 ${sg(sl.v, 0)} ± ${sl.s.toFixed(0)} mm (${sl.v > 0 ? '아래 방향' : '위 방향으로 읽힘, 방향 미확인'}), 모든 궤도 종합`, `Movement along the slope since the storm: ${sg(sl.v, 0)} ± ${sl.s.toFixed(0)} mm a month (${sl.v > 0 ? 'downslope' : 'reads as upslope, direction not confirmed'}), all tracks combined`)
      : sl ? L(`사면 방향으로 감지되는 이동 없음: 월 ${sg(sl.v, 0)} ± ${sl.s.toFixed(0)} mm. 월 ${sl.ub} mm보다 빠른 이동은 배제됨.`, `No detectable movement along the slope: ${sg(sl.v, 0)} ± ${sl.s.toFixed(0)} mm a month. Anything faster than ${sl.ub} mm a month is ruled out.`)
      : C.moving[u] ? L(`잡음 수준을 넘는 이동 감지: 궤도 ${b.id}에서 ${sg(b.v)} cm (잡음 ±${b.s.toFixed(1)} cm)`, `Movement above the noise floor: ${sg(b.v)} cm on track ${b.id} (noise ±${b.s.toFixed(1)} cm)`)
        : L(`잡음 수준을 넘는 이동 없음 (최대: 궤도 ${b.id}에서 ${sg(b.v)} cm, 잡음 ±${b.s.toFixed(1)} cm)`, `No movement above the noise floor (largest: ${sg(b.v)} cm on track ${b.id}, noise ±${b.s.toFixed(1)} cm)`);
  const rank = pct >= 0.8 ? L(`AI 취약도 순위: 전체 사면 중 상위 ${Math.max(1, Math.round((1 - pct) * 100))}%`, `AI susceptibility rank: top ${Math.max(1, Math.round((1 - pct) * 100))}% of all slopes`) : L(`AI 취약도 순위: 전체 사면의 ${Math.round(pct * 100)}%보다 높음`, `AI susceptibility rank: above ${Math.round(pct * 100)}% of all slopes`);
  const below = [C.bld[u] > 0 ? L(`건물 ${C.bld[u]}동`, `${C.bld[u]} building(s)`) : '', C.road[u] > 0 ? L('주요 도로', 'a main road') : ''].filter(Boolean).join(', ') || L('지도에 표시된 건물·주요 도로 없음', 'no mapped building or main road');
  // what to look at first on this slope, from the reasons above
  const look = [], has = (re) => rs.some((r) => re.test(r.f));
  if (C.moving[u]) look.push(L(`사면 상부(${compass(C.aspect[u], lang)}향 사면의 능선 쪽)에서 새 인장균열·단차를 먼저 찾을 것. 레이더는 약 ${CELL.r} m 범위의 평균 이동을 본 것이므로 범위 전체를 훑을 것.`, `Start at the crest of the ${compass(C.aspect[u], lang)}-facing slope and look for fresh tension cracks or steps. The radar saw the average movement over about ${CELL.r} m, so walk the whole circle.`));
  if (C.label[u]) look.push(L('2026년 7월 붕괴 후보지(자동 탐지)가 이 격자 안에 있음. 실제 붕괴인지 벌채·개간인지 확인하고 B8에 기록.', 'A July 2026 scar candidate (automatic) lies inside this cell. Check whether it is a real failure or a clearing and record it in B8.'));
  if (rs.some((r) => r.f === 'curv' && r.v > 0) || has(/^twi$|dstream/)) look.push(L('물이 모이는 지형. 오목한 곳과 계곡 머리에서 용수·세굴·지반 포화 확인 (B4).', 'Water gathers here. Check hollows and gully heads for seepage, scouring and saturated ground (B4).'));
  if (C.burn[u] > 0.2 || C.dnbr[u] > 0.27 || has(/burn|dnbr|loss2025/)) look.push(L('산불 피해지. 고사목 뿌리 부패, 지표 침식, 식생 회복 정도 확인 (B5).', 'Burned ground. Check dead-tree roots, surface erosion and how far vegetation has recovered (B5).'));
  if (has(/slope|steep30|relief/)) look.push(L('급경사 구간. 뜬돌·낙석과 사면 하부 배부름 확인 (B3).', 'Steep sections. Check for loose rock, rockfall and bulging at the toe (B3).'));
  if (C.bld[u] > 0) look.push(L(`아래쪽 약 300 m 이내 건물 ${C.bld[u]}동(OpenStreetMap). 건물 뒤 사면 하부, 옹벽 균열, 실제 거주 여부 확인 (B6, B7).`, `${C.bld[u]} building(s) within about 300 m downslope (OpenStreetMap). Check the slope foot behind them, retaining-wall cracks and whether people live there (B6, B7).`));
  if (C.road[u] > 0) look.push(L('주요 도로 인접. 절토면, 도로 배수구, 낙석 흔적 확인.', 'A main road is close. Check the cut slope, road drains and signs of rockfall.'));
  if (!look.length) look.push(L('특정 징후 없음. B3–B6 항목을 순서대로 점검.', 'No specific pointer. Work through B3–B6 in order.'));
  return { lv, b, pct, radar, rs, mv, rank, below, look };
}

// ---- one form (six pages) --------------------------------------------------------
function form(u) {
  const F = facts(u), no = fno(u), where = cname(C.county[u]), lvn = LV()[F.lv], rk = byCounty.get(C.county[u])?.indexOf(u) ?? -1;
  const coord = `${C.lat[u].toFixed(5)}°N, ${C.lon[u].toFixed(5)}°E`, kakao = `https://map.kakao.com/link/map/${no},${C.lat[u].toFixed(6)},${C.lon[u].toFixed(6)}`;
  const GRID = '<svg><defs><pattern id="g5" width="18.898" height="18.898" patternUnits="userSpaceOnUse"><path d="M18.898 0H0V18.898" fill="none" stroke="#b4b4ae" stroke-width=".7"/></pattern></defs><rect width="100%" height="100%" fill="url(#g5)"/></svg>';

    ${rows.map(([t, h], i) => `<tr${tall ? ' class="tall"' : ''}><td class="c">${i + 1}</td><td>${t}</td><td class="c">${cb('')}</td><td class="c">${cb('')}</td><td class="c">${cb('')}</td><td class="w"><small>${h || ''}</small></td></tr>`).join('')}</table>`;

  // ---------- page 1: where it is and why it is listed ----------
  const p1 = `<section class="page">
    <header class="h1"><h1><small>GeoSentry · ${L('NISAR 레이더 + AI 취약도 기반', 'FROM NISAR RADAR + AI SUSCEPTIBILITY')}</small>${L('사면 현장 점검서', 'Slope field inspection form')}</h1>
      <div class="fno"><div><span>${L('서식 번호', 'Form no.')}</span><b>${no}</b></div><div><span>${L('점검 등급', 'Level')}</span><b>${lvn}</b></div><div><span>${L('위험 지수', 'Danger index')}</span><b>${Math.round(C.danger[u])} / 100</b></div></div></header>
    <div class="note">${L('초안 — 해커톤 시제품이며 정부 공식 서식이 아닙니다. 경보가 아니고 붕괴 시점을 예측하지 않습니다. A부는 위성 자료로 자동 작성된 참고 정보이며, 판정은 B부의 현장 점검으로 합니다.', 'Draft — a hackathon prototype, not an official government form. Not a warning and not a forecast of when a slope will fail. Part A is filled in automatically from satellite data for reference; the judgment is made in the field, in Part B.')}</div>
    <div class="part">${partA}<span>${L('자동 작성 · 수정하지 말 것', 'pre-printed · do not edit')}</span></div>
    ${h2('A1', L('위치', 'Location'))}
    ${kv([
      [[L('행정구역', 'District'), `<b>${where}</b>`], [L('사면 번호', 'Slope no.'), `<b>#${u}</b> &nbsp;<small>${K ? L('전국 90 m 지도', 'nationwide 90 m map') : L('경북 20 m 지도', 'regional 20 m map')}</small>`]],
      [[L('좌표 (WGS84)', 'Coordinates (WGS84)'), `<b>${coord}</b><br><small>${dms(C.lat[u], 'N', 'S')} &nbsp; ${dms(C.lon[u], 'E', 'W')}</small>`], [L('분석 단위', 'Unit of analysis'), `${L('육각 격자', 'hexagon')} ${L('약', 'about')} ${CELL.km2} km²<br><small>${L(`중심에서 반경 약 ${CELL.r} m (지도의 점선 원)`, `about ${CELL.r} m around the centre (dashed circle on the map)`)}</small>`]],
      [[L('고도', 'Elevation'), `${C.elev[u].toFixed(0)} m`], [L('평균 경사 · 방향', 'Mean slope · facing'), `${C.slope[u].toFixed(0)}° · ${compass(C.aspect[u], lang)}${L('향', '')} (${C.aspect[u].toFixed(0)}°)`]],
      [[L('점검 등급', 'Inspection level'), `<span class="lv l${F.lv}">${lvn}</span>`], [L('점검 순위', 'Rank'), rk >= 0 ? `${L('시·군 내', 'in the district')} <b>${rk + 1}</b> / ${byCounty.get(C.county[u]).length} &nbsp;·&nbsp; ${K ? L('전국', 'nationwide') : L('전체', 'whole area')} <b>${rankAll.get(u).toLocaleString()}</b> / ${order.length.toLocaleString()}` : L('우선 점검 목록에 없음', 'not on the check-first list')]],
      [[L('위험 지수', 'Danger index'), `<span class="big">${Math.round(C.danger[u])}</span> / 100`], [L('지수 구성', 'Made of'), `${L('사면', 'slope')} <b>${Math.round(C.hz[u])}</b> / 100 &nbsp;·&nbsp; ${L('사면 아래', 'below the slope')} <b>${C.ex[u]}</b> / 100`]],
    ])}
    <div class="maps" style="margin-top:2.4mm">${map(u, 11, false, L('위치도', 'Locator'), 5000)}${map(u, CELL.z, true, L('상세도', 'Detail'), K ? 400 : 200)}</div>
    <div class="find"><div><b>${L('찾아가는 길', 'Getting there')}</b> — ${L('QR 코드를 찍으면 카카오맵에서 이 좌표가 열립니다. 점선 원이 점검 범위입니다.', 'Scan the QR code to open this point in Kakao Map. The dashed circle is the area to inspect.')}<div class="url">${kakao}</div>
      <div style="margin-top:1.2mm">${L('접근로·주차 위치 메모', 'Access and parking notes')}: ${ln(88)}</div></div><div class="qr" data-url="${kakao}"></div></div>
    ${h2('A2', L('선정 사유', 'Why this slope is listed'), L('AI 모델과 레이더가 든 이유', 'from the AI model and the radar'))}
    <ul class="why"><li data-n="①">${F.mv}</li><li data-n="②">${F.rank}${F.rs.length ? ' — ' + F.rs.map((r) => r.s).join(' · ') : ''}</li><li data-n="③">${L('사면 아래 약 300 m 이내', 'Within about 300 m downslope')}: ${F.below}</li>${C.label[u] ? `<li data-n="④">${L('이 사면에 2026년 7월 붕괴 후보지가 있음 (자동 탐지, 사람이 아직 확인하지 않음)', 'A July 2026 scar candidate lies on this slope (automatic, not yet checked by a person)')}</li>` : ''}</ul>
    ${h2('A3', L('이 사면에서 먼저 볼 것', 'What to look at first here'))}
    <ul class="why">${F.look.slice(0, 5).map((s) => `<li data-n="▸">${s}</li>`).join('')}</ul>

  // ---------- page 2: the measurements ----------
  const trs = D.tracks.filter((tr) => Number.isFinite(C['sig_' + tr.id][u]) && C['sig_' + tr.id][u] > 0 || C['meas_' + tr.id][u]).map((tr) => {
    const id = tr.id, v = C['cum_' + id][u], s = C['sig_' + id][u], ok = C['meas_' + id][u] > 0 && Number.isFinite(v), z = ok && s > 0 ? v / s : NaN, se = C['sens_' + id][u], c0 = C['cohpre_' + id][u], c1 = C['cohstorm_' + id][u];
    return `<tr><td><b>${id}</b> <small>${tr.name}</small></td><td class="c">${tr.dir === 'ascending' ? L('상향 ↑', 'ascending ↑') : L('하향 ↓', 'descending ↓')}</td><td class="n c">${day(tr.dates[0])} – ${day(tr.dates[tr.dates.length - 1])} <small>(${tr.dates.length}${L('회', ' passes')})</small></td>
      <td class="n c"><b>${ok ? sg(v) : '—'}</b></td><td class="n c">${ok ? '±' + s.toFixed(1) : '—'}</td><td class="n c">${Number.isFinite(z) ? Math.abs(z).toFixed(1) + '×' : '—'}</td><td class="n c">${Number.isFinite(se) ? Math.abs(se).toFixed(2) : '—'}</td><td class="n c">${Number.isFinite(c0) ? c0.toFixed(2) : '—'} → ${Number.isFinite(c1) ? c1.toFixed(2) : '—'}</td>
      <td class="c">${ok ? L('측정됨', 'measured') : L('측정 불가', 'not measurable')}</td></tr>`;

  const radarBlock = F.radar && trs ? `${C.vd ? `<table class="f"><tr><th style="width:38mm">${L('사면 방향 이동 속도 (모든 궤도 종합)', 'Rate along the slope (all tracks combined)')}</th><td>${F.mv}</td></tr></table><div style="height:1.6mm"></div>` : ''}<table class="f"><thead><tr><th>${L('궤도', 'Track')}</th><th>${L('비행 방향', 'Pass')}</th><th>${L('관측 기간 (2026)', 'Period (2026)')}</th><th>${L('누적 이동 cm', 'Movement cm')}</th><th>${L('잡음 cm', 'Noise cm')}</th><th>${L('잡음 대비', 'vs noise')}</th><th>${L('방향 민감도', 'Sensitivity')}</th><th>${L('긴밀도 전→폭우', 'Coherence pre→storm')}</th><th>${L('상태', 'Status')}</th></tr></thead>${trs}</table>
      <div style="height:1.6mm"></div>${chart(u)}
      <div class="foot">${L('이동량은 레이더 시선 방향 값이며 사면을 따라 실제로 움직인 거리와 다릅니다. "방향 민감도"는 사면 아래 방향으로 1 cm 움직일 때 레이더가 보는 크기(0–1)로, 0에 가까우면 그 궤도는 이 사면의 이동을 거의 못 봅니다. 양수는 위성 쪽으로의 이동이며, 방향은 영상쌍 23개 모두에서 기상 자료와 대조해 확인했습니다. "긴밀도"가 낮으면(식생·지표 변화) 측정 신뢰도가 떨어집니다.', 'Movement is along the radar line of sight, not the distance moved down the slope. "Sensitivity" is how much of 1 cm of downslope movement the radar sees (0–1); near 0 that track is almost blind to this slope. Positive is toward the satellite; the direction was checked against weather data on all 23 image pairs. Low "coherence" (vegetation or surface change) means a less reliable measurement.')}</div>`
    : `<table class="f"><tr><td style="padding:3mm">${F.mv}<br><small>${L('이 사면은 AI 취약도 순위와 사면 아래 시설만으로 선정되었습니다. 레이더 이동 측정값이 없으므로 B3 변형 징후 점검이 유일한 이동 확인 수단입니다.', 'This slope was chosen from the AI susceptibility rank and what lies below it only. With no radar measurement, the B3 signs of movement are the only check on movement.')}</small></td></tr></table>`;
  const p2 = `<section class="page">${rh(partA)}
    ${h2('A4', L('레이더 이동 측정 (NISAR)', 'Radar movement (NISAR)'), L('L밴드 파장 24.2 cm · 12일 간격', 'L-band, 24.2 cm wavelength · every 12 days'))}
    ${radarBlock}
    ${h2('A5', L('AI 판정 근거', 'What the AI saw'))}
    ${kv([
      [[L('취약도 순위', 'Susceptibility rank'), `${L('전체', 'all')} ${D.n.toLocaleString()}${L('개 사면 중 상위', ' slopes: top')} <b>${Math.max(1, Math.round((1 - F.pct) * 100))}%</b>`], [L('이동 탐지', 'Movement detector'), F.radar ? `${C.moving[u] ? `<b>${L('이동 감지', 'movement detected')}</b>` : L('감지 안 됨', 'none detected')}${Number.isFinite(C.zmax[u]) && C.zmax[u] > 0 ? ` &nbsp;<small>${L('최대', 'peak')} ${C.zmax[u].toFixed(1)}× ${L('잡음', 'noise')}</small>` : ''}` : L('레이더 자료 없음', 'no radar data')]],
      ...F.rs.map((r, i) => [[`${L('주요 요인', 'Main factor')} ${i + 1}`, r.s, 3]]),
    ])}
    ${h2('A6', L('지표 · 강우', 'Ground cover · rain'), L('Sentinel-2 · ERA5', 'Sentinel-2 · ERA5'))}
    ${kv([
      [[L('산불 피해 강도', 'Burn severity'), `dNBR ${C.dnbr[u].toFixed(2)} <small>${C.dnbr[u] >= 0.44 ? L('(심함)', '(high)') : C.dnbr[u] >= 0.27 ? L('(중간)', '(moderate)') : C.dnbr[u] >= 0.1 ? L('(약함)', '(low)') : L('(피해 없음)', '(unburned)')}</small>`], [L('불탄 면적', 'Burned share'), `${Math.round(C.burn[u] * 100)}% <small>${L('중간 이상 피해', 'moderate or worse')}</small>`]],
      [[L('식생 (2026.6)', 'Vegetation (Jun 2026)'), `NDVI ${C.ndvi[u].toFixed(2)}${C.ndvi[u] < 0.6 ? ` <small>${L('(빈약)', '(sparse)')}</small>` : ''}`], K && C.ndvi_latest ? [L('식생 (최근)', 'Vegetation (latest)'), Number.isFinite(C.ndvi_latest[u]) ? `NDVI ${C.ndvi_latest[u].toFixed(2)}` : '—'] : [L('광학 관측', 'Optical view'), C.seen[u] ? L('폭우 뒤 구름 없는 영상 있음', 'cloud-free image after the storm') : L('폭우 뒤 구름 없는 영상 없음', 'no cloud-free image after the storm')]],
      [[L('폭우 강수 (7.18–19)', 'Storm rain (18–19 Jul)'), `<b>${C.rain_storm[u].toFixed(0)} mm</b>`], [L('폭우 전 30일 강수', 'Rain in the 30 days before'), `${C.rain_ante[u].toFixed(0)} mm${K && C.rain_season && Number.isFinite(C.rain_season[u]) ? ` <small>· ${L('6–10월 합계', 'Jun–Oct total')} ${C.rain_season[u].toFixed(0)} mm</small>` : ''}`]],

    ${h2('B12', L('서명', 'Signatures'))}
    <table class="f sig"><thead><tr><th style="width:24mm"></th><th>${L('소속 · 직급', 'Office · post')}</th><th>${L('성명', 'Name')}</th><th>${L('서명', 'Signature')}</th><th style="width:30mm">${L('날짜', 'Date')}</th></tr></thead>
      ${[L('점검자', 'Inspector'), L('점검자', 'Inspector'), L('확인자', 'Reviewed by')].map((s) => `<tr><th>${s}</th><td></td><td></td><td></td><td></td></tr>`).join('')}</table>
    ${pf(5)}</section>`;

  // ---------- page 6: sketch and photo log ----------
  const p6 = `<section class="page">${rh(partB)}
    ${h2('B13', L('현장 약도', 'Site sketch'), `${L('한 칸 = 5 mm · 축척 1 :', 'one square = 5 mm · scale 1 :')} ${ln(14)}`)}
    <div class="grid">${GRID}<div class="north">▲<br>N</div><div class="lg">${L('표시할 것: 사면 윤곽과 능선, 균열(~~~), 단차(┬┬┬), 용수(●), 물길(→), 낙석(▲), 건물(■), 도로(═), 시설물, B3·B4 항목 번호, 사진 촬영 위치와 방향(①→)', 'Mark: slope outline and ridge, cracks (~~~), steps (┬┬┬), seepage (●), water paths (→), rockfall (▲), buildings (■), roads (═), structures, B3 and B4 item numbers, photo positions and directions (①→)')}</div></div>
    ${h2('B14', L('단면 약도', 'Cross-section'), L('사면 위(왼쪽)에서 아래(오른쪽)로', 'from the top of the slope (left) to the foot (right)'))}
    <div class="grid" style="height:42mm">${GRID}</div>
    ${h2('B15', L('사진 대장', 'Photo log'), L('최소: 전경, 사면 상부, 사면 하부, 징후마다 1장, 사면 아래 건물', 'at least: overview, crest, toe, one per sign, buildings below'))}
    <table class="f"><thead><tr><th style="width:9mm">${L('번호', 'No.')}</th><th style="width:38mm">${L('촬영 위치 · 방향', 'From where · facing')}</th><th>${L('찍은 대상', 'What it shows')}</th><th style="width:20mm">${L('B3·B4 항목', 'B3/B4 item')}</th><th style="width:36mm">${L('파일명 · 시각', 'File · time')}</th></tr></thead>
      ${Array.from({ length: 10 }, (_, i) => `<tr><td class="c">${'①②③④⑤⑥⑦⑧⑨⑩'[i]}</td><td class="w"></td><td></td><td></td><td></td></tr>`).join('')}</table>
    <div class="foot">${L('이 점검서는 GeoSentry 팀(2026 NASA Space Apps Challenge 서울)이 만든 시제품입니다. 점검 항목은 급경사지·산사태 취약지 현장 조사에서 일반적으로 확인하는 징후를 따랐으며, 정부 고시 서식이나 법정 평가표를 대체하지 않습니다. 건물 자료: OpenStreetMap. 지형: Copernicus DEM. 광학: Sentinel-2. 강우: ERA5. 레이더: NASA-ISRO NISAR.', 'This form is a prototype by the GeoSentry team (NASA Space Apps Challenge 2026, Seoul). The items follow the signs usually checked in field surveys of steep slopes and landslide-prone areas; it does not replace any official form or statutory assessment sheet. Buildings: OpenStreetMap. Terrain: Copernicus DEM. Optical: Sentinel-2. Rain: ERA5. Radar: NASA-ISRO NISAR.')}</div>
    ${pf(6)}</section>`;
  let html = p1 + p2 + p3 + p4 + p5 + p6;
  if (!K && C.sim) {                                          // regional map: flagged slopes use the simulated debris flow (p11), not the 300 m rule
    const swap = [['아래쪽 약 300 m 이내에 건물이나 주요 도로가 있는 사면', '모의 토석류가 건물이나 주요 도로에 닿는 사면'], ['a building or main road lies within about 300 m downslope', 'a simulated debris flow from the slope reaches a building or main road']];
    if (C.sim[u] > 0) swap.push(['아래쪽 약 300 m 이내 건물', '모의 토석류가 닿는 건물'], ['within about 300 m downslope (OpenStreetMap)', 'reached by the simulated debris flow (OpenStreetMap)'],
      ['사면 아래 약 300 m 이내', '모의 토석류 경로'], ['Within about 300 m downslope', 'In the simulated debris path'], ['(약 300 m 이내)', '(모의 토석류 경로)'], ['(within about 300 m)', '(simulated debris path)']);
    for (const [a, b] of swap) html = html.replaceAll(a, b);
  }
  if (K && C.reach) {                                         // nationwide: each slope's own debris reach, predicted by ML model 3 (k04b)
    html = html.replaceAll('아래쪽 약 300 m 이내에 건물이나 주요 도로가 있는 사면', 'AI 3이 예측한 그 사면의 토석류 도달 거리 안에 건물이나 주요 도로가 있는 사면')
      .replaceAll('a building or main road lies within about 300 m downslope', 'a building or main road lies inside the debris reach that AI model 3 predicts for the slope');
    return html.replaceAll('300 m', (Math.round(C.reach[u] / 10) * 10) + ' m');
  }
  return html.replaceAll('300 m', (K ? 360 : 300) + ' m');      // downslope search distance: k05 / p08
}

// ---- toolbar and render ------------------------------------------------------------
const $ = (s) => document.querySelector(s);
function render() {
  document.documentElement.lang = lang;
  document.title = L('GeoSentry 사면 현장 점검서', 'GeoSentry slope field inspection form');
  const list = byCounty.get(county) || [], onList = list.includes(sel), at = Math.max(0, list.indexOf(sel));
  $('#county').innerHTML = counties.map((c) => `<option value="${c.id}" ${c.id === county ? 'selected' : ''}>${cname(c.id)} (${byCounty.get(c.id).length})</option>`).join('');
  $('#slope').innerHTML = (onList ? '' : `<option value="${sel}" selected>#${sel} · ${LV()[C.level[sel]]}</option>`) + list.map((u, i) => `<option value="${u}" ${u === sel ? 'selected' : ''}>${i + 1}${L('위', '')} · #${u} · ${L('지수', 'index')} ${Math.round(C.danger[u])}${C.moving[u] ? ' · ' + L('이동', 'moving') : ''}</option>`).join('');
  $('#count').innerHTML = [1, 3, 5, 10].map((n) => `<option value="${n}" ${n === count ? 'selected' : ''}>${n === 1 ? L('이 사면만', 'This slope only') : L(`여기부터 ${n}곳`, `${n} slopes from here`)}</option>`).join('');
  $('#lang').textContent = lang === 'ko' ? 'English' : '한국어';
  $('#print').textContent = L('인쇄 / PDF', 'Print / PDF');
  $('#back').textContent = L('시·군 우선순위표', 'District priority sheet');
  $('#back').href = `sheet.html?lang=${lang}&county=${county}${AREA === 'region' ? '&area=region' : ''}`;
  const us = onList && count > 1 ? list.slice(at, at + count) : [sel];
  $('#out').innerHTML = us.map(form).join('');
  hillshades();
  document.querySelectorAll('.page').forEach((pg) => {
    const pf = pg.querySelector('.pf'), last = pf.previousElementSibling;
    for (let fs = 8.4; fs >= 7 && pf.getBoundingClientRect().top - last.getBoundingClientRect().bottom < 10; fs -= 0.2) pg.style.fontSize = fs + 'pt';
  });
  if (window.qrcode) document.querySelectorAll('.qr').forEach((el) => { const q = window.qrcode(0, 'M'); q.addData(el.dataset.url); q.make(); el.innerHTML = q.createSvgTag({ cellSize: 2, margin: 0, scalable: true }); });
  else document.querySelectorAll('.find').forEach((el) => { el.style.gridTemplateColumns = '1fr'; });
  const p = new URLSearchParams({ u: sel, lang }); if (count > 1) p.set('n', count); if (AREA === 'region') p.set('area', 'region');
  history.replaceState(null, '', '?' + p);
}
$('#county').onchange = (e) => { county = +e.target.value; sel = byCounty.get(county)[0]; render(); };
$('#slope').onchange = (e) => { sel = +e.target.value; render(); };
$('#count').onchange = (e) => { count = +e.target.value; render(); };
$('#lang').onclick = () => { lang = lang === 'ko' ? 'en' : 'ko'; render(); };
render();
</script>
</body>
</html>
