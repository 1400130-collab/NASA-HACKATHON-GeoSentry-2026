<style>
  .page { position: relative; width: 210mm; height: 297mm; margin: 18px auto; background: #fff; padding: 11mm 13mm 15mm; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, .55); }

  .part span { font: 600 6.6pt/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; opacity: .85; }

  .lv { display: inline-block; border: 1.2pt solid var(--ink); padding: 0 1.6mm; font-weight: 800; }

  .cb { display: inline-flex; align-items: center; gap: 1mm; margin-right: 3mm; white-space: nowrap; }

  td.c .cb { margin: 0; }
  .ln { display: inline-block; border-bottom: .5pt solid var(--ink); height: 3.4mm; vertical-align: bottom; margin: 0 .6mm; }
  /* danger index and the models, page 1 */
  .top { display: grid; grid-template-columns: 50mm 1fr; gap: 2.4mm; margin-top: 2.4mm; }

  .dial .k { font: 600 6.4pt/1.2 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: #bdbab2; }
  .dial > b { font: 900 34pt/.95 var(--sans); letter-spacing: -.05em; margin-top: 1.2mm; font-variant-numeric: tabular-nums; }
  .dial > b small { font-size: 10pt; letter-spacing: 0; color: #bdbab2; margin-left: .6mm; }
  .dial .scale { position: relative; display: grid; grid-template-columns: 50fr 30fr 20fr; gap: .5mm; height: 2mm; margin: 2mm 0 .8mm; }
  .dial .scale i:nth-child(1) { background: #4a4a46; } .dial .scale i:nth-child(2) { background: var(--amber); } .dial .scale i:nth-child(3) { background: var(--red); }
  .dial .scale u { position: absolute; top: -1.1mm; width: 1mm; height: 4.2mm; background: #fff; margin-left: -.5mm; outline: .6pt solid #0b0c0d; }
  .dial .ticks { position: relative; height: 2.4mm; font: 500 5.6pt/1 var(--mono); color: #8d8a83; }
  .dial .ticks span { position: absolute; top: 0; transform: translateX(-50%); } .dial .ticks span:first-child { transform: none; } .dial .ticks span:last-child { transform: translateX(-100%); }
  .dial .parts { margin-top: auto; padding-top: 1.6mm; display: grid; gap: .8mm; }
  .dial .parts div { display: grid; grid-template-columns: 15mm 1fr 7mm; gap: 1.2mm; align-items: center; font: 500 6.2pt/1.1 var(--mono); color: #d6d3cb; }

  .dial .rk { margin-top: 1.4mm; font-size: 6.8pt; color: #d6d3cb; line-height: 1.3; }
  .dial .rk b { color: #fff; }

  /* maps */
  .maps { display: grid; grid-template-columns: 255px 1fr; gap: 3mm; margin-top: 1mm; }
  .map { position: relative; height: 318px; overflow: hidden; border: .8pt solid var(--line); background: #eee; }
  .map canvas, .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map img { position: absolute; max-width: none; }
  .map .tag { position: absolute; left: 0; top: 0; background: #0b0c0d; color: #fff; padding: .6mm 1.8mm; font: 700 6.6pt/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  .map .att { position: absolute; right: 0; bottom: 0; background: rgba(255,255,255,.85); padding: 0 1mm; font-size: 6pt; color: #333; }
  .vmap { position: relative; border: .8pt solid var(--line); }
  .vmap canvas { display: block; width: 100%; }
  .vmap .tag { position: absolute; left: 0; top: 0; background: #0b0c0d; color: #fff; padding: .6mm 1.8mm; font: 700 6.6pt/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  .vmap .att { position: absolute; right: 0; bottom: 0; background: rgba(255,255,255,.88); padding: .2mm 1.2mm; font-size: 5.8pt; color: #333; }
  .key { display: flex; gap: 4mm; margin: 1.1mm 0 0; font-size: 6.8pt; color: var(--mute); flex-wrap: wrap; align-items: center; }
  .find { display: grid; grid-template-columns: 1fr 23mm; gap: 4mm; align-items: center; margin-top: 2mm; border: .8pt solid var(--line); padding: 1.6mm 2.2mm; }
  .find .qr svg { width: 23mm; height: 23mm; display: block; }
  .find .url { font: 400 6.8pt/1.3 var(--mono); word-break: break-all; color: var(--mute); }
  ul.why { margin: 0; padding: 0; list-style: none; border: .5pt solid var(--line); }
  ul.why li { padding: 1.1mm 2mm 1.1mm 7mm; position: relative; }
  ul.why li + li { border-top: .5pt solid var(--soft); }
  ul.why li::before { content: attr(data-n); position: absolute; left: 2mm; font-weight: 800; }
  ul.why li.hot::before { color: var(--red); }
  /* the debris flow */
  .fstats { display: grid; grid-template-columns: repeat(6, 1fr); border: .8pt solid var(--line); border-top: 0; }
  .fstats div { padding: 1.4mm 1.8mm 1.6mm; }
  .fstats div + div { border-left: .5pt solid var(--line); }
  .fstats b { display: block; font: 900 13pt/1.05 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .fstats b small { font-size: 7pt; font-weight: 700; letter-spacing: 0; }
  .fstats span { display: block; font-size: 6.4pt; color: var(--mute); line-height: 1.25; margin-top: .4mm; }
  .fstats .hot { background: var(--red); color: #fff; } .fstats .hot span { color: #fde3dd; }
  .phys { font-size: 6.9pt; color: var(--mute); margin-top: 1.2mm; line-height: 1.4; }
  .phys b { color: var(--ink); }
  .trig { display: grid; grid-template-columns: auto 1fr; gap: 3mm; align-items: center; margin-top: 2.4mm; background: #0b0c0d; color: #f3f1ec; padding: 2mm 2.6mm; }
  .trig b { font: 900 20pt/1 var(--sans); letter-spacing: -.03em; } .trig b small { font-size: 8pt; color: #bdbab2; letter-spacing: 0; }
  .trig p { margin: 0; font-size: 7.3pt; line-height: 1.4; } .trig p em { font-style: normal; font: 600 6.4pt/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #ff8a70; display: block; margin-bottom: .6mm; }
  /* radar */
  .solve { display: grid; grid-template-columns: 44mm 1fr; border: .8pt solid var(--line); }
  .solve .hd { padding: 2mm 2.4mm; border-right: .5pt solid var(--line); display: flex; flex-direction: column; }
  .solve .hd b { font: 900 17pt/1 var(--sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .solve .hd .tagx { display: inline-block; margin-top: 1.4mm; font: 700 6.2pt/1.3 var(--mono); letter-spacing: .08em; padding: .6mm 1.2mm; background: var(--blue); color: #fff; align-self: flex-start; }
  .solve .hd .tagx.mv { background: var(--red); }
  .solve .hd p { margin: 1.4mm 0 0; font-size: 6.6pt; color: var(--mute); line-height: 1.35; }
  .solve .ch { padding: 1mm 1.4mm .6mm; } .solve .ch > svg { width: 100%; height: auto; display: block; }
  .chart { border: .5pt solid var(--line); padding: 1mm 1.5mm 0; }
  .chart svg { width: 100%; height: auto; display: block; }
  .safe { margin-top: 2.6mm; border: 1.6pt solid var(--ink); padding: 1.8mm 2.4mm; }
  .safe b { font-size: 9.5pt; }
  .verdict { display: grid; grid-template-columns: repeat(4, 1fr); border: .8pt solid var(--line); }
  .verdict div { padding: 1.6mm 2mm 2mm; min-height: 17mm; }
  .verdict div + div { border-left: .5pt solid var(--line); }
  .verdict b { display: flex; align-items: center; gap: 1.6mm; font-size: 10pt; }
  .verdict b i { width: 4.2mm; height: 4.2mm; border: 1pt solid var(--ink); flex: none; }
  .lines div { border-bottom: .5pt solid var(--soft); height: 7.2mm; }
  .grid { position: relative; height: 96mm; border: .8pt solid var(--line); }
  .grid > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .grid .north { position: absolute; right: 3mm; top: 2mm; font-weight: 800; text-align: center; line-height: 1; font-size: 9pt; }
  .grid .lg { position: absolute; left: 2mm; bottom: 1.5mm; right: 2mm; font-size: 7.2pt; color: var(--mute); background: #fff; padding: .6mm 1.2mm; border: .4pt solid var(--soft); }
  .foot { margin-top: 2.2mm; font-size: 6.9pt; color: var(--mute); line-height: 1.45; }
  .sig td { height: 12mm; }
  @media print {
    .page { margin: 0; break-after: page; box-shadow: none; }

<script type="module">
// One printable field inspection form per slope: seven A4 pages.
//   Part A (pages 1-3) is filled in from the data; Part B (pages 4-7) is filled in by hand on the slope.
//   1  where it is: danger index, what each model said, a locator and a road map with the debris path
//   2  why it is listed, what to look at first, and what happens if it lets go: the GPU debris flow (regional runs) or
//      ML 3's reach, on our own map of the real world (js/paper.js), plus the rain it has already stood through
//   3  the radar: the time-series solver's fit, every track, the AI's inputs, ground cover and rain
//   form.html?u=123            one slope            form.html?county=214&n=5   the county's top five
//   &area=region for the 20 m North Gyeongsang map, &lang=en for English
import { loadAll, BASE, AREA } from './js/data.js';
import { addScores, checkOrder } from './js/score.js';
import { reason, compass } from './js/i18n.js';
import { paperGeo, vectorMap, frameFor, osmMap, flowsOnOSM, solverData, solverSVG, solverLegend, qrSVG, bar, RED, BLUE } from './js/paper.js';

const qs = new URLSearchParams(location.search);
let lang = qs.get('lang') || 'ko';
const L = (ko, en) => (lang === 'ko' ? ko : en);
const D = addScores(await loadAll(() => {}));
const C = D.col, M = D.meta, K = D.korea;
const CELL = K ? { km2: 0.74, r: 480, z: 15 } : { km2: 0.105, r: 185, z: 16 };      // H3 res 8 / res 9 hexagon
const order = checkOrder(D), rankAll = new Map(order.map((u, i) => [u, i + 1]));
const byCounty = new Map();
order.forEach((u) => { const c = C.county[u]; if (!byCounty.has(c)) byCounty.set(c, []); byCounty.get(c).push(u); });
const counties = M.counties.filter((c) => byCounty.has(c.id));
if (K) counties.sort((a, b) => a.prov - b.prov || a.ko.localeCompare(b.ko, 'ko'));
const provOf = (c) => (M.provinces ? M.provinces.find((p) => p.id === c.prov) : null);
const cname = (id) => { const c = M.counties.find((x) => x.id === id); if (!c) return '—'; const p = provOf(c); return (p ? L(p.ko, p.en) + (lang === 'ko' ? ' ' : ' · ') : (K ? '' : L('경상북도 ', 'North Gyeongsang · '))) + L(c.ko, c.en); };

let sel = qs.has('u') ? Math.min(D.n - 1, Math.max(0, +qs.get('u') | 0)) : -1;
let county = sel >= 0 ? C.county[sel] : (+qs.get('county') || counties.slice().sort((a, b) => byCounty.get(b.id).length - byCounty.get(a.id).length)[0].id);
if (!byCounty.has(county) && sel < 0) county = counties[0].id;
if (sel < 0) sel = byCounty.get(county)[0];
let count = Math.min(10, Math.max(1, +qs.get('n') || 1));

const normal = await new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = BASE + 'normal.jpg'; });
await new Promise((res) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js'; s.onload = s.onerror = res; document.head.append(s); });
const G = await paperGeo(D, normal);

// ---- small pieces ---------------------------------------------------------------
const cb = (...o) => o.map((s) => `<span class="cb"><i></i>${s}</span>`).join('');
const ln = (mm = 16, unit = '') => `<span class="ln" style="width:${mm}mm"></span>${unit}`;
const sg = (v, d = 1) => { const a = Math.abs(v).toFixed(d); return (+a === 0 ? '' : v > 0 ? '+' : '−') + a; };
const r10 = (v) => (Math.round(v / 10) * 10).toLocaleString();
const dms = (v, pos, neg) => { const a = Math.abs(v), d = Math.floor(a), m = Math.floor((a - d) * 60), s = ((a - d) * 60 - m) * 60; return `${d}°${String(m).padStart(2, '0')}′${s.toFixed(1).padStart(4, '0')}″${v >= 0 ? pos : neg}`; };
const fno = (u) => `SW-${K ? 'K' : 'R'}-${String(u).padStart(6, '0')}`;
const LV = () => [L('측정 불가', 'Not measurable'), L('신호 없음', 'No signal'), L('관찰', 'Watch'), L('우선 점검', 'Check first')];
const kv = (rows) => `<table class="f kv">${rows.map((r) => `<tr>${r.map(([k, v, span]) => `<th>${k}</th><td${span ? ` colspan="${span}"` : ''}>${v}</td>`).join('')}</tr>`).join('')}</table>`;
const day = (s) => `${+s.slice(4, 6)}.${+s.slice(6, 8)}`;
const best = (u) => { let b = null; D.tracks.forEach((tr) => { const v = C['cum_' + tr.id][u], s = C['sig_' + tr.id][u]; if (C['meas_' + tr.id][u] && Number.isFinite(v) && s > 0 && (!b || Math.abs(v / s) > Math.abs(b.v / b.s))) b = { v, s, id: tr.id }; }); return b; };
const slide = (u) => (C.vd && Number.isFinite(C.vd[u]) && C.vds[u] > 0 ? { v: C.vd[u], s: C.vds[u], ub: Math.ceil(Math.abs(C.vd[u]) + 2 * C.vds[u]) } : null);   // merged downslope rate, mm a month
const hasRadar = (u) => !K || C.rcov[u] > 0;
const isSim = (u) => !!(C.sim && C.sim[u] > 0);
const fmtDate = (ms) => new Date(ms).toLocaleDateString(lang === 'ko' ? 'ko-KR' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const susc = M.suscept, ship = susc.shipped_uses_nisar ? susc.results.model_full : susc.results.model_without_nisar, AN = M.anomaly.results;
const xf = (v) => (Math.abs(v - Math.round(v)) < 0.15 ? Math.round(v) : v.toFixed(1));

// ---- radar history, drawn for paper: black lines told apart by dash pattern ----
const DASH = ['', '5 3', '1.5 3'];
function chart(u) {
  const W = 660, H = 128, l = 34, r = 8, t = 8, b = 20, X0 = 15, X1 = 147;
  const S = D.tracks.map((tr, i) => ({ i, tr, pts: C['meas_' + tr.id][u] ? tr.days.map((d, k) => [d, D.cum(u, i, k)]).filter((p) => Number.isFinite(p[1])) : [] })).filter((s) => s.pts.length > 1);
  if (!S.length) return '';
  let ym = 2; S.forEach((s) => s.pts.forEach((p) => { ym = Math.max(ym, Math.abs(p[1]) * 1.2); })); ym = Math.ceil(ym);
  const x = (d) => l + (d - X0) / (X1 - X0) * (W - l - r), y = (v) => t + (ym - v) / (2 * ym) * (H - t - b);
  const np = D.tracks[0].noise_pair, s0 = np.reduce((a, c) => a + c, 0) / np.length, band = Array.from({ length: 12 }, (_, k) => [21 + k * 11, 2 * s0 * Math.sqrt(k)]);
  const step = ym <= 3 ? 1 : ym <= 8 ? 2 : 5, yt = []; for (let v = -Math.floor(ym / step) * step; v <= ym; v += step) yt.push(v);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" font-size="9.5" font-family="Roboto Mono, monospace">
    <rect x="${x(47)}" y="${t}" width="${x(49) - x(47)}" height="${H - t - b}" fill="#bbb"/>
    <path d="M${band.map(([d, v]) => `${x(d).toFixed(1)} ${y(Math.min(v, ym)).toFixed(1)}`).join('L')}L${band.slice().reverse().map(([d, v]) => `${x(d).toFixed(1)} ${y(-Math.min(v, ym)).toFixed(1)}`).join('L')}Z" fill="#e6e6e2"/>
    ${yt.map((v) => `<path d="M${l} ${y(v).toFixed(1)}H${W - r}" stroke="${v ? '#ccc' : '#111'}" stroke-width="${v ? .5 : 1}"/><text x="${l - 5}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${sg(v, 0)}</text>`).join('')}
    ${[[30, L('7월', 'Jul')], [61, L('8월', 'Aug')], [92, L('9월', 'Sep')], [122, L('10월', 'Oct')]].map(([d, s]) => `<path d="M${x(d)} ${H - b}v4" stroke="#111"/><text x="${x(d) + 3}" y="${H - 6}">${s}</text>`).join('')}
    <text x="${x(48)}" y="${t + 9}" text-anchor="middle" font-weight="700">${L('폭우', 'storm')}</text>
    ${S.map((s) => `<path d="M${s.pts.map((p) => `${x(p[0]).toFixed(1)} ${y(Math.max(-ym, Math.min(ym, p[1]))).toFixed(1)}`).join('L')}" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="${DASH[s.i]}"/>${s.pts.map((p) => `<circle cx="${x(p[0]).toFixed(1)}" cy="${y(Math.max(-ym, Math.min(ym, p[1]))).toFixed(1)}" r="2.2" fill="#fff" stroke="#111" stroke-width="1.2"/>`).join('')}`).join('')}
    <rect x="${l}" y="${t}" width="${W - l - r}" height="${H - t - b}" fill="none" stroke="#111" stroke-width=".8"/>
  </svg></div>
  <div class="hint" style="margin-top:.8mm">${S.map((s) => `<svg width="26" height="6" style="vertical-align:middle"><path d="M0 3H26" stroke="#111" stroke-width="1.5" stroke-dasharray="${DASH[s.i]}"/></svg> ${L('궤도', 'track')} ${s.tr.id} ${s.tr.dir === 'ascending' ? '↑' : '↓'}`).join(' &nbsp; ')} &nbsp; ${L('옅은 띠 = 잡음 범위(±2σ) · 짙은 띠 = 2026.7.18–19 폭우 · 세로축 = 레이더 시선 방향 누적 이동(cm)', 'pale band = noise range (±2σ) · dark band = storm of 18–19 Jul 2026 · vertical axis = cumulative movement along the radar line of sight (cm)')}</div>`;
}

// ---- what the data says about one slope ----------------------------------------
function facts(u) {
  const lv = C.level[u], b = best(u), sl = slide(u), pct = C.pct[u], radar = hasRadar(u), sim = isSim(u);
  const rs = [[C.r1[u], C.v1[u]], [C.r2[u], C.v2[u]], [C.r3[u], C.v3[u]]].filter((r) => r[0] >= 0).map((r) => ({ f: M.features[r[0]], v: r[1], s: reason(M.features[r[0]], r[1], lang) }));
  const mv = !radar ? L('NISAR 레이더 미처리 지역 (경북 산불 지역만 처리). 안정하다는 뜻이 아님.', 'No NISAR radar here yet (processed for the North Gyeongsang burn area only). Not the same as stable.')
    : !b ? L('어느 궤도에서도 레이더로 측정할 수 없음. 안정하다는 뜻이 아님.', 'Radar cannot measure this slope on any track. Not the same as stable.')
      : C.vd && !sl ? L('레이더가 이 사면을 한쪽에서만 보아 미끄러짐을 다른 신호와 구분할 수 없음. 안정하다는 뜻이 아님.', 'Radar sees this slope from one side only, so sliding cannot be told apart from other signals. Not the same as stable.')
      : sl && C.moving[u] ? L(`폭우 이후 사면 방향 이동: 월 ${sg(sl.v, 0)} ± ${sl.s.toFixed(0)} mm (${sl.v > 0 ? '아래 방향' : '위 방향으로 읽힘, 방향 미확인'}), 모든 궤도 종합`, `Movement along the slope since the storm: ${sg(sl.v, 0)} ± ${sl.s.toFixed(0)} mm a month (${sl.v > 0 ? 'downslope' : 'reads as upslope, direction not confirmed'}), all tracks combined`)
      : sl ? L(`사면 방향으로 감지되는 이동 없음: 월 ${sg(sl.v, 0)} ± ${sl.s.toFixed(0)} mm. 월 ${sl.ub} mm보다 빠른 이동은 배제됨.`, `No detectable movement along the slope: ${sg(sl.v, 0)} ± ${sl.s.toFixed(0)} mm a month. Anything faster than ${sl.ub} mm a month is ruled out.`)
      : C.moving[u] ? L(`잡음 수준을 넘는 이동 감지: 궤도 ${b.id}에서 ${sg(b.v)} cm (잡음 ±${b.s.toFixed(1)} cm)`, `Movement above the noise floor: ${sg(b.v)} cm on track ${b.id} (noise ±${b.s.toFixed(1)} cm)`)
        : L(`잡음 수준을 넘는 이동 없음 (최대: 궤도 ${b.id}에서 ${sg(b.v)} cm, 잡음 ±${b.s.toFixed(1)} cm)`, `No movement above the noise floor (largest: ${sg(b.v)} cm on track ${b.id}, noise ±${b.s.toFixed(1)} cm)`);
  const rank = pct >= 0.8 ? L(`AI 위험 순위: 전체 사면 중 상위 ${Math.max(1, Math.round((1 - pct) * 100))}%`, `AI risk rank: top ${Math.max(1, Math.round((1 - pct) * 100))}% of all slopes`) : L(`AI 위험 순위: 전체 사면의 ${Math.round(pct * 100)}%보다 높음`, `AI risk rank: above ${Math.round(pct * 100)}% of all slopes`);
  const below = [C.bld[u] > 0 ? L(`건물 ${C.bld[u]}동`, `${C.bld[u]} building(s)`) : '', C.road[u] > 0 ? L('주요 도로', 'a main road') : ''].filter(Boolean).join(', ') || L('지도에 표시된 건물·주요 도로 없음', 'no mapped building or main road');
  // what to look at first on this slope, from the reasons above
  const look = [], has = (re) => rs.some((r) => re.test(r.f));
  if (C.moving[u]) look.push(L(`사면 상부(${compass(C.aspect[u], lang)}향 사면의 능선 쪽)에서 새 인장균열·단차를 먼저 찾을 것. 레이더는 약 ${CELL.r} m 범위의 평균 이동을 본 것이므로 범위 전체를 훑을 것.`, `Start at the crest of the ${compass(C.aspect[u], lang)}-facing slope and look for fresh tension cracks or steps. The radar saw the average movement over about ${CELL.r} m, so walk the whole circle.`));
  if (sim) look.push(L(`모의 토석류 경로(2쪽 지도)를 따라 ${compass(C.rf_dir[u], lang)} 방향으로 약 ${r10(C.rf_len[u])} m 걸어 내려갈 것. 실제 계곡·물길이 있는지, 출구에 집이 있는지 확인 (B7, B8).`, `Walk the simulated debris path (map on page 2) about ${r10(C.rf_len[u])} m ${compass(C.rf_dir[u], lang)}. Check for a real gully or channel along it and for houses at its mouth (B7, B8).`));
  else if (C.reach) look.push(L(`${compass(C.aspect[u], lang)} 방향 아래로 약 ${r10(C.reach[u])} m(ML 3 도달 거리)까지 내려가 계곡 출구의 집과 도로를 확인 (B7).`, `Walk down about ${r10(C.reach[u])} m toward the ${compass(C.aspect[u], lang)} (ML 3's reach) and check houses and roads at gully mouths (B7).`));
  if (C.label[u]) look.push(L('2026년 7월 붕괴 후보지(자동 탐지)가 이 격자 안에 있음. 실제 붕괴인지 벌채·개간인지 확인하고 B8에 기록.', 'A July 2026 scar candidate (automatic) lies inside this cell. Check whether it is a real failure or a clearing and record it in B8.'));
  if (rs.some((r) => r.f === 'curv' && r.v > 0) || has(/^twi$|dstream/)) look.push(L('물이 모이는 지형. 오목한 곳과 계곡 머리에서 용수·세굴·지반 포화 확인 (B4).', 'Water gathers here. Check hollows and gully heads for seepage, scouring and saturated ground (B4).'));
  if (C.burn[u] > 0.2 || C.dnbr[u] > 0.27 || has(/burn|dnbr|loss2025/)) look.push(L('산불 피해지. 고사목 뿌리 부패, 지표 침식, 식생 회복 정도 확인 (B5).', 'Burned ground. Check dead-tree roots, surface erosion and how far vegetation has recovered (B5).'));
  if (has(/slope|steep30|relief/)) look.push(L('급경사 구간. 뜬돌·낙석과 사면 하부 배부름 확인 (B3).', 'Steep sections. Check for loose rock, rockfall and bulging at the toe (B3).'));
  if (C.bld[u] > 0) look.push(L(`아래쪽 약 300 m 이내 건물 ${C.bld[u]}동(OpenStreetMap). 건물 뒤 사면 하부, 옹벽 균열, 실제 거주 여부 확인 (B6, B7).`, `${C.bld[u]} building(s) within about 300 m downslope (OpenStreetMap). Check the slope foot behind them, retaining-wall cracks and whether people live there (B6, B7).`));
  if (C.road[u] > 0) look.push(L('주요 도로 인접. 절토면, 도로 배수구, 낙석 흔적 확인.', 'A main road is close. Check the cut slope, road drains and signs of rockfall.'));
  if (!look.length) look.push(L('특정 징후 없음. B3–B6 항목을 순서대로 점검.', 'No specific pointer. Work through B3–B6 in order.'));
  return { lv, b, pct, radar, rs, mv, rank, below, look, sim };
}

// what each model said about this slope, as tiles (the map's "model outputs" block, on paper)
function modelTiles(u, F) {
  const t = (cls, k, nm, v, p, g) => `<div class="${cls}"><i>${k}</i><span>${nm}</span><b>${v}</b>${g !== undefined ? `<span class="gauge"><u style="width:${Math.min(100, Math.max(2, g * 100)).toFixed(0)}%"></u></span>` : ''}<p>${p}</p></div>`;
  const top = Math.max(0.1, (1 - F.pct) * 100), sl = slide(u), dt = C.det ? C.det[u] : NaN, out = [];
  out.push(t('', 'ML 1', L('위험 순위', 'Risk ranker'), `${L('상위', 'top')} ${top < 1 ? top.toFixed(1) : Math.round(top)}<small>%</small>`, L(`LightGBM · 전국 ${D.n.toLocaleString()}개 사면 중`, `LightGBM · among ${D.n.toLocaleString()} slopes`), F.pct));
  out.push(F.radar && Number.isFinite(dt) ? t(C.moving[u] ? '' : '', 'ML 2', L('이동 탐지', 'Movement detector'), `${dt.toFixed(2)}`, L('GRU 신경망 점수 · 이동 판정은 상위 5% + 역산 4σ', 'GRU score · "moving" needs its top 5% and the solver at 4σ'), dt)
    : t('na', 'ML 2', L('이동 탐지', 'Movement detector'), '—', L('레이더 자료 없음', 'no radar data here')));
  if (F.sim) out.push(t('ph', 'PHYSICS', L('토석류 모의', 'Debris-flow sim'), `${r10(C.rf_len[u])}<small> m</small>`, L(`GPU 천수 흐름 · 최고 ${Math.round(C.rf_vmax[u])} m/s`, `GPU shallow-water run · top ${Math.round(C.rf_vmax[u])} m/s`), C.rf_len[u] / 450));
  else if (C.reach) out.push(t(C.reach_src[u] === 2 ? 'ph' : '', C.reach_src[u] === 2 ? 'PHYSICS' : 'ML 3', L('토석류 도달 거리', 'Debris reach'), `${r10(C.reach[u])}<small> m</small>`, C.reach_src[u] === 2 ? L('이 격자에서 GPU로 직접 모의', 'simulated on the GPU in this cell') : L(`GPU 모의 ${M.reach.simulated_slopes.toLocaleString()}건으로 학습한 LightGBM`, `LightGBM taught by ${M.reach.simulated_slopes.toLocaleString()} GPU runs`), C.reach[u] / 450));
  if (sl) out.push(t(C.moving[u] ? '' : 'ph', 'SOLVER', L('레이더 속도 역산', 'Radar speed solver'), `${sg(sl.v, 0)}<small> ± ${sl.s.toFixed(0)} ${L('mm/월', 'mm/mo')}</small>`, C.moving[u] ? L('사면 아래로 이동 중', 'moving downhill') : L(`감지되는 이동 없음 · 월 ${sl.ub} mm 초과 배제`, `nothing detectable · over ${sl.ub} mm/mo ruled out`), Math.abs(sl.v / sl.s) / (M.velocity?.z_detect || 4)));
  else if (C.vd) out.push(t('na', 'SOLVER', L('레이더 속도 역산', 'Radar speed solver'), '—', F.radar ? L('한 방향에서만 관측되어 풀 수 없음', 'seen from one side only: not solvable') : L('레이더 자료 없음', 'no radar data here')));
  return out.join('');
}

  const GRID = '<svg><defs><pattern id="g5" width="18.898" height="18.898" patternUnits="userSpaceOnUse"><path d="M18.898 0H0V18.898" fill="none" stroke="#b4b4ae" stroke-width=".7"/></pattern></defs><rect width="100%" height="100%" fill="url(#g5)"/></svg>';

  const NSC = [L('없음', 'None'), L('경미', 'Slight'), L('뚜렷', 'Clear')];
  const signs = (rows, tall) => `<table class="f"><thead><tr><th style="width:7mm">${L('번호', 'No.')}</th><th>${L('점검 항목', 'What to check')}</th>${NSC.map((s) => `<th style="width:11mm">${s}</th>`).join('')}<th style="width:62mm">${L('위치 · 크기 · 비고', 'Where · size · notes')}</th></tr></thead>
    ${rows.map(([t, h], i) => `<tr${tall ? ' class="tall"' : ''}><td class="c">${i + 1}</td><td>${t}</td><td class="c">${cb('')}</td><td class="c">${cb('')}</td><td class="c">${cb('')}</td><td class="w"><small>${h || ''}</small></td></tr>`).join('')}</table>`;
  const dz = Math.round(C.danger[u]);

  // ---------- page 1: where it is, the danger index and what each model said ----------
  const p1 = `<section class="page">
    <div class="band"><img src="img/geosentry-logo.svg?v=2" alt=""><span class="wm">GeoSentry</span><span class="kind">${L('사면 현장 점검서', 'Slope field inspection form')}<br>${L('A 위성 사전 조사 · B 현장 점검', 'A satellite pre-survey · B field inspection')}</span>${F.lv === 3 ? `<span class="lvb">${lvn}</span>` : ''}<span class="id">${no}</span></div>
    <div class="title"><div><div class="kick">${L('사면 현장 점검서', 'Slope field inspection form')} · <b>${lvn}</b>${rk >= 0 ? ` · ${L('시·군 내', 'in district')} ${rk + 1} / ${byCounty.get(C.county[u]).length}` : ''}</div>
        <h1>${where}<em>#${u} · ${coord}</em></h1></div>

    <div class="note">${L('초안 — 해커톤 시제품이며 정부 공식 서식이 아닙니다. 경보가 아니고 붕괴 시점을 예측하지 않습니다. A부는 위성 자료로 자동 작성된 참고 정보이며, 판정은 B부의 현장 점검으로 합니다.', 'Draft — a hackathon prototype, not an official government form. Not a warning and not a forecast of when a slope will fail. Part A is filled in automatically from satellite data for reference; the judgment is made in the field, in Part B.')}</div>
    <div class="top">

        <div class="scale"><i></i><i></i><i></i><u style="left:${dz}%"></u></div><div class="ticks"><span style="left:0">0</span><span style="left:50%">50</span><span style="left:80%">80</span><span style="left:100%">100</span></div>
        <div class="rk">${rk >= 0 ? L(`시·군 점검 순서 <b>${rk + 1}번째</b> / ${byCounty.get(C.county[u]).length} · ${K ? '전국' : '전체'} <b>${rankAll.get(u).toLocaleString()}</b> / ${order.length.toLocaleString()}`, `<b>No. ${rk + 1}</b> of ${byCounty.get(C.county[u]).length} in the district · <b>${rankAll.get(u).toLocaleString()}</b> of ${order.length.toLocaleString()} ${K ? 'nationwide' : 'in the area'}`) : L('우선 점검 목록에 없음', 'not on the check-first list')}</div>

      <div><div class="kick" style="margin-bottom:1mm">${L('이 사면에 대한 모델 출력', 'What each model said about this slope')}</div><div class="stack">${modelTiles(u, F)}</div></div>

    ${kv([

    ])}
    <div class="maps" style="margin-top:2.4mm"><div class="map" data-osm="loc" data-u="${u}"></div><div class="map" data-osm="det" data-u="${u}"></div></div>
    <div class="find"><div><b>${L('찾아가는 길', 'Getting there')}</b> — ${L('QR 코드를 찍으면 카카오맵에서 이 좌표가 열립니다. 점선 원이 점검 범위, 붉은 점들이 모의 토석류 경로입니다.', 'Scan the QR code to open this point in Kakao Map. The dashed circle is the area to inspect; red marks are the simulated debris path.')}<div class="url">${kakao}</div>
      <div style="margin-top:1.2mm">${L('접근로·주차 위치 메모', 'Access and parking notes')}: ${ln(88)}</div></div><div class="qr">${qrSVG(kakao)}</div></div>
    ${pf(1)}</section>`;

  // ---------- page 2: why it is listed, what to look at first, what happens if it lets go ----------
  const RO = M.runout, sim = F.sim, tb = sim && Number.isFinite(C.rf_tbld[u]), hasFlow = !!(G && G.flowsOf(u).length);
  const flowStats = sim ? `<div class="fstats">

      <div class="${tb ? 'hot' : ''}"><b>${tb ? Math.round(C.rf_tbld[u]) + '<small> s</small>' : '—'}</b><span>${L('첫 건물까지', 'to the first building')}</span></div>

  const rec = C.rec48 && Number.isFinite(C.rec48[u]) ? `<div class="trig"><b>${C.rec48[u].toFixed(0)}<small> mm / 48 h</small></b><p><em>${L('재점검 기준', 'Re-inspection trigger')}</em>${L(`2025년 산불 이후 이 사면이 견딘 48시간 최대 강우 (${fmtDate(Date.parse(M.rain_record.day0) + C.rec_day[u] * 864e5)}). 48시간 예보가 이 값을 넘으면 비가 그친 뒤 다시 점검하십시오. 과거 강우에 대한 사실이며 예측이 아닙니다 (ERA5, 10 km 격자).`, `The heaviest 48 h rain this slope has stood through since the 2025 fire (${fmtDate(Date.parse(M.rain_record.day0) + C.rec_day[u] * 864e5)}). If a 48 h forecast goes above it, inspect again once the rain stops. A fact about past rain, not a prediction (ERA5, 10 km grid).`)}</p></div>` : '';

  const radarBlock = F.radar && trs ? `${solver}<table class="f"><thead><tr><th>${L('궤도', 'Track')}</th><th>${L('비행 방향', 'Pass')}</th><th>${L('관측 기간 (2026)', 'Period (2026)')}</th><th>${L('누적 이동 cm', 'Movement cm')}</th><th>${L('잡음 cm', 'Noise cm')}</th><th>${L('잡음 대비', 'vs noise')}</th><th>${L('방향 민감도', 'Sensitivity')}</th><th>${L('긴밀도 전→폭우', 'Coherence pre→storm')}</th><th>${L('상태', 'Status')}</th></tr></thead>${trs}</table>

    ])}

    <table class="f"><thead><tr><th style="width:9mm">${L('번호', 'No.')}</th><th style="width:38mm">${L('촬영 위치 · 방향', 'From where · facing')}</th><th>${L('찍은 대상', 'What it shows')}</th><th style="width:20mm">${L('B3·B4 항목', 'B3/B4 item')}</th><th style="width:36mm">${L('파일명 · 시각', 'File · time')}</th></tr></thead>
      ${Array.from({ length: 10 }, (_, i) => `<tr><td class="c">${'①②③④⑤⑥⑦⑧⑨⑩'[i]}</td><td class="w"></td><td></td><td></td><td></td></tr>`).join('')}</table>
    <div class="foot">${L('이 점검서는 GeoSentry 팀(2026 NASA Space Apps Challenge 서울)이 만든 시제품입니다. 점검 항목은 급경사지·산사태 취약지 현장 조사에서 일반적으로 확인하는 징후를 따랐으며, 정부 고시 서식이나 법정 평가표를 대체하지 않습니다. 건물 자료: OpenStreetMap. 지형: Copernicus DEM. 광학: Sentinel-2. 강우: ERA5. 레이더: NASA-ISRO NISAR.', 'This form is a prototype by the GeoSentry team (NASA Space Apps Challenge 2026, Seoul). The items follow the signs usually checked in field surveys of steep slopes and landslide-prone areas; it does not replace any official form or statutory assessment sheet. Buildings: OpenStreetMap. Terrain: Copernicus DEM. Optical: Sentinel-2. Rain: ERA5. Radar: NASA-ISRO NISAR.')}</div>
    ${pf(7)}</section>`;
  let html = p1 + p2 + p3 + b1 + b2 + b3 + b4;
  if (!K && C.sim) {                                          // regional map: flagged slopes use the simulated debris flow (p11), not the 300 m rule
    const swap = [['아래쪽 약 300 m 이내에 건물이나 주요 도로가 있는 사면', '모의 토석류가 건물이나 주요 도로에 닿는 사면'], ['a building or main road lies within about 300 m downslope', 'a simulated debris flow from the slope reaches a building or main road']];
    if (C.sim[u] > 0) swap.push(['아래쪽 약 300 m 이내 건물', '모의 토석류가 닿는 건물'], ['within about 300 m downslope (OpenStreetMap)', 'reached by the simulated debris flow (OpenStreetMap)'],
      ['사면 아래 약 300 m 이내', '모의 토석류 경로'], ['Within about 300 m downslope', 'In the simulated debris path'], ['(약 300 m 이내)', '(모의 토석류 경로)'], ['(within about 300 m)', '(simulated debris path)']);
    for (const [a, b] of swap) html = html.replaceAll(a, b);
  }
  if (K && C.reach) {                                         // nationwide: each slope's own debris reach, predicted by ML model 3 (k04b)
    html = html.replaceAll('아래쪽 약 300 m 이내에 건물이나 주요 도로가 있는 사면', 'AI 3이 예측한 그 사면의 토석류 도달 거리 안에 건물이나 주요 도로가 있는 사면')
      .replaceAll('a building or main road lies within about 300 m downslope', 'a building or main road lies inside the debris reach that AI model 3 predicts for the slope');
    return html.replaceAll('300 m', (Math.round(C.reach[u] / 10) * 10) + ' m');
  }
  return html.replaceAll('300 m', (K ? 360 : 300) + ' m');      // downslope search distance: k05 / p08
}

// ---- maps, once the pages are in the document ------------------------------------------------
async function drawMaps(root, my) {
  if (!G) return;
  const jobs = [];
  root.querySelectorAll('.map[data-osm]').forEach((el) => {
    const u = +el.dataset.u, loc = el.dataset.osm === 'loc', W = el.clientWidth, H = el.clientHeight;
    const fl = G.flowsOf(u), reach = !isSim(u) && !fl.length && C.reach ? C.reach[u] : 0;     // the fan only where no run was drawn
    let lat = C.lat[u], lon = C.lon[u], z = 11;
    if (!loc) {                                                  // road map, fitted to the cell, its flow and its reach
      const f = frameFor(G, u, { flows: fl, reach: reach + G.cellR * 0.4, aspect: C.aspect[u], min: K ? 1100 : 520, pad: 1.15, aspectRatio: W / H });
      const toLL = G.fitLL(f.cx, f.cz, 8000), [la, lo] = toLL(f.cx, f.cz); lat = la; lon = lo;
      z = Math.min(17, Math.log2(156543.03392 * Math.cos(lat * Math.PI / 180) / (f.w / W)));
      el._ll = toLL;
    }
    const m = osmMap({ W, H, lat, lon, z }), [cx, cy] = m.px(C.lat[u], C.lon[u]), r = CELL.r / m.mpp;
    let marks = '';
    if (loc) marks = `<circle cx="${cx}" cy="${cy}" r="11" fill="none" stroke="${RED}" stroke-width="2.6"/><circle cx="${cx}" cy="${cy}" r="3" fill="${RED}"/>`;
    else {
      if (reach) { const R = (reach + G.cellR * 0.4) / m.mpp, a = (C.aspect[u] - 90) * Math.PI / 180, h = 38 * Math.PI / 180;
        marks += `<path d="M${cx} ${cy}L${(cx + Math.cos(a - h) * R).toFixed(1)} ${(cy + Math.sin(a - h) * R).toFixed(1)}A${R.toFixed(1)} ${R.toFixed(1)} 0 0 1 ${(cx + Math.cos(a + h) * R).toFixed(1)} ${(cy + Math.sin(a + h) * R).toFixed(1)}Z" fill="rgba(199,52,31,.16)" stroke="${RED}" stroke-width="1.8" stroke-dasharray="6 3"/>`; }
      marks += `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="rgba(255,255,255,.08)" stroke="#111" stroke-width="2" stroke-dasharray="7 4"/><path d="M${cx - 7} ${cy}h14M${cx} ${cy - 7}v14" stroke="#111" stroke-width="2.2"/>`;
    }
    el.innerHTML = `${m.tiles}<canvas width="${W * 2}" height="${H * 2}"></canvas><svg viewBox="0 0 ${W} ${H}">${marks}${m.deco}</svg><span class="tag">${loc ? L('위치도', 'Locator') : L('상세도', 'Detail')}</span><span class="att">© OpenStreetMap</span>`;
    if (!loc && fl.length) flowsOnOSM(G, el.querySelector('canvas'), m, fl, el._ll);
  });
  root.querySelectorAll('canvas.big').forEach((cv) => {
    const u = +cv.dataset.u, fl = G.flowsOf(u), sim = isSim(u), reach = !sim && !fl.length && C.reach ? C.reach[u] : 0;
    const f = frameFor(G, u, { flows: fl, reach: reach + G.cellR * 0.4, aspect: C.aspect[u], min: K ? 1500 : 640, pad: 1.12, aspectRatio: 695 / +cv.dataset.h });
    const ghost = G.flowsNear(f.hx, f.hz, f.w).filter((i) => !fl.includes(i));
    jobs.push(vectorMap(G, cv, { cx: f.cx, cz: f.cz, hx: f.hx, hz: f.hz, mpp: f.w / 695, dpr: 3, hexR: G.cellR, flows: fl, ghost,
      fan: reach ? { r: reach + G.cellR * 0.4, az: C.aspect[u] } : null, ko: lang === 'ko' }).then((hits) => {
      if (my !== ticket) return;
      const el = cv.closest('.page').querySelector('.hitn');
      if (el && fl.length) el.textContent = L(` · 지도(Overture)에서는 ${hits}동`, ` · ${hits} on this map (Overture)`);
    }));
  });
  await Promise.all(jobs);
}

// ---- toolbar and render ------------------------------------------------------------
const $ = (s) => document.querySelector(s);
let ticket = 0;
async function render() {
  const my = ++ticket;
  document.documentElement.lang = lang;
  document.title = L('GeoSentry 사면 현장 점검서', 'GeoSentry slope field inspection form');
  const list = byCounty.get(county) || [], onList = list.includes(sel), at = Math.max(0, list.indexOf(sel));
  $('#county').innerHTML = counties.map((c) => `<option value="${c.id}" ${c.id === county ? 'selected' : ''}>${cname(c.id)} (${byCounty.get(c.id).length})</option>`).join('');
  $('#slope').innerHTML = (onList ? '' : `<option value="${sel}" selected>#${sel} · ${LV()[C.level[sel]]}</option>`) + list.map((u, i) => `<option value="${u}" ${u === sel ? 'selected' : ''}>${i + 1}${L('위', '')} · #${u} · ${L('지수', 'index')} ${Math.round(C.danger[u])}${C.moving[u] ? ' · ' + L('이동', 'moving') : ''}</option>`).join('');
  $('#count').innerHTML = [1, 3, 5, 10].map((n) => `<option value="${n}" ${n === count ? 'selected' : ''}>${n === 1 ? L('이 사면만', 'This slope only') : L(`여기부터 ${n}곳`, `${n} slopes from here`)}</option>`).join('');
  $('#lang').textContent = lang === 'ko' ? 'English' : '한국어';
  $('#print').textContent = L('인쇄 / PDF', 'Print / PDF');
  $('#back').textContent = L('시·군 우선순위표', 'District priority sheet');
  $('#back').href = `sheet.html?lang=${lang}&county=${county}${AREA === 'region' ? '&area=region' : ''}`;
  const us = onList && count > 1 ? list.slice(at, at + count) : [sel];
  $('#out').innerHTML = us.map(form).join('');
  // fit each page: shrink its type until the footer clears the last block
  document.querySelectorAll('.page').forEach((pg) => {
    const pf = pg.querySelector('.pf'), last = pf.previousElementSibling;
    for (let fs = 8.4; fs >= 6.8 && pf.getBoundingClientRect().top - last.getBoundingClientRect().bottom < 8; fs -= 0.2) pg.style.fontSize = fs + 'pt';
  });
  const p = new URLSearchParams({ u: sel, lang }); if (count > 1) p.set('n', count); if (AREA === 'region') p.set('area', 'region');
  history.replaceState(null, '', '?' + p);
  $('#status').textContent = L('지도 그리는 중…', 'drawing maps…');
  await drawMaps($('#out'), my);
  if (my === ticket) $('#status').textContent = '';
}
$('#county').onchange = (e) => { county = +e.target.value; sel = byCounty.get(county)[0]; render(); };
$('#slope').onchange = (e) => { sel = +e.target.value; render(); };
$('#count').onchange = (e) => { count = +e.target.value; render(); };
$('#lang').onclick = () => { lang = lang === 'ko' ? 'en' : 'ko'; render(); };
render();
</script>
